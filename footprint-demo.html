<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footprint 订单流图表演示</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 320px auto;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .time-axis {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .time-item {
            font-size: 14px;
            color: #888;
        }
        
        .kline-container {
            background-color: #222;
            border-radius: 8px;
            padding: 15px;
        }
        
        .footprint-container {
            background-color: #222;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }
        
        .title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ccc;
        }
        
        #kline-chart {
            width: 100%;
            height: 400px;
        }
        
        #footprint-canvas {
            width: 100%;
            height: 400px;
            background-color: #1a1a1a;
            border: 1px solid #333;
        }
        
        .footprint-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .minute-label {
            width: 50px;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
        }
        
        .footprint-column {
            flex: 1;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h1>Footprint 订单流图表演示</h1>
    
    <div class="container">
        <!-- 时间轴 -->
        <div class="time-axis">
            <div class="time-item">09:30</div>
            <div class="time-item">09:31</div>
            <div class="time-item">09:32</div>
            <div class="time-item">09:33</div>
            <div class="time-item">09:34</div>
        </div>
        
        <!-- K线图表 -->
        <div class="kline-container">
            <div class="title">1分钟 K线</div>
            <div id="kline-chart"></div>
        </div>
        
        <!-- Footprint图表 -->
        <div class="footprint-container">
            <div class="title">Footprint 订单流</div>
            <canvas id="footprint-canvas"></canvas>
        </div>
    </div>
    
    <script>
        // Mock数据
        const MOCK_MINUTES = [
            {
                minute: "09:30",
                kline: { open: 18.80, high: 18.83, low: 18.77, close: 18.81, volume: 3420 },
                minute_delta: -87,
                rows: [
                    { price: 18.82, sell: 87, buy: 79, delta: -8 },
                    { price: 18.81, sell: 198, buy: 170, delta: -28 }, // 主力卖
                    { price: 18.80, sell: 59, buy: 56, delta: -3 },
                    { price: 18.79, sell: 80, buy: 67, delta: -13 },
                    { price: 18.78, sell: 23, buy: 18, delta: -5 }
                ]
            },
            {
                minute: "09:31",
                kline: { open: 18.81, high: 18.85, low: 18.80, close: 18.84, volume: 4100 },
                minute_delta: +132,
                rows: [
                    { price: 18.85, sell: 22, buy: 64, delta: +42 },
                    { price: 18.84, sell: 31, buy: 128, delta: +97 }, // 主力买
                    { price: 18.83, sell: 18, buy: 52, delta: +34 }
                ]
            },
            {
                minute: "09:32",
                kline: { open: 18.84, high: 18.86, low: 18.82, close: 18.83, volume: 2800 },
                minute_delta: -45,
                rows: [
                    { price: 18.86, sell: 45, buy: 28, delta: -17 },
                    { price: 18.85, sell: 62, buy: 48, delta: -14 },
                    { price: 18.84, sell: 38, buy: 32, delta: -6 },
                    { price: 18.83, sell: 25, buy: 30, delta: +5 }
                ]
            },
            {
                minute: "09:33",
                kline: { open: 18.83, high: 18.88, low: 18.82, close: 18.87, volume: 3600 },
                minute_delta: +98,
                rows: [
                    { price: 18.88, sell: 18, buy: 52, delta: +34 },
                    { price: 18.87, sell: 25, buy: 88, delta: +63 }, // 主力买
                    { price: 18.86, sell: 32, buy: 45, delta: +13 }
                ]
            },
            {
                minute: "09:34",
                kline: { open: 18.87, high: 18.89, low: 18.85, close: 18.86, volume: 2900 },
                minute_delta: -32,
                rows: [
                    { price: 18.89, sell: 58, buy: 32, delta: -26 },
                    { price: 18.88, sell: 42, buy: 38, delta: -4 },
                    { price: 18.87, sell: 35, buy: 30, delta: -5 },
                    { price: 18.86, sell: 28, buy: 30, delta: +2 }
                ]
            }
        ];
        
        // 渲染K线图表
        function renderKline() {
            const chart = echarts.init(document.getElementById('kline-chart'));
            
            const klineData = MOCK_MINUTES.map(minute => [
                minute.kline.open,
                minute.kline.close,
                minute.kline.low,
                minute.kline.high
            ]);
            
            const option = {
                backgroundColor: '#1a1a1a',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: MOCK_MINUTES.map(m => m.minute),
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#888'
                    }
                },
                yAxis: {
                    type: 'value',
                    scale: true,
                    axisLine: {
                        lineStyle: {
                            color: '#333'
                        }
                    },
                    axisLabel: {
                        color: '#888'
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#222'
                        }
                    }
                },
                series: [{
                    name: 'K线',
                    type: 'candlestick',
                    data: klineData,
                    itemStyle: {
                        color: '#1d9e75',
                        color0: '#e24b4a',
                        borderColor: '#1d9e75',
                        borderColor0: '#e24b4a'
                    }
                }]
            };
            
            chart.setOption(option);
        }
        
        // 渲染Footprint图表
        function renderFootprint() {
            const canvas = document.getElementById('footprint-canvas');
            const ctx = canvas.getContext('2d');
            
            // 设置Canvas尺寸
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);
            
            const CELL_H = 18;
            const CELL_W = 110;
            const COLUMN_GAP = 20;
            const START_X = 20;
            const START_Y = 20;
            
            // 渲染每个分钟的Footprint
            MOCK_MINUTES.forEach((minuteData, minuteIndex) => {
                const x = START_X + minuteIndex * (CELL_W + COLUMN_GAP);
                
                // 计算该分钟的最大绝对值delta
                const maxAbsDelta = Math.max(...minuteData.rows.map(r => Math.abs(r.delta)));
                
                // 渲染每一行
                minuteData.rows.forEach((row, rowIndex) => {
                    const y = START_Y + rowIndex * CELL_H;
                    
                    // 计算颜色强度
                    const intensity = Math.abs(row.delta) / maxAbsDelta;
                    const alpha = 0.2 + intensity * 0.8;
                    
                    // 设置背景色
                    ctx.fillStyle = row.delta > 0 
                        ? `rgba(29,158,117,${alpha})` 
                        : `rgba(226,75,74,${alpha})`;
                    
                    // 绘制背景
                    ctx.fillRect(x, y, CELL_W, CELL_H);
                    
                    // 绘制价格
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText(row.price.toFixed(2), x + 8, y + 13);
                    
                    // 绘制sell × buy
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText(`${row.sell} × ${row.buy}`, x + CELL_W - 8, y + 13);
                });
                
                // 绘制分钟delta
                const deltaY = START_Y + minuteData.rows.length * CELL_H + 16;
                ctx.fillStyle = minuteData.minute_delta > 0 ? '#1d9e75' : '#e24b4a';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(minuteData.minute_delta.toString(), x + CELL_W / 2, deltaY);
                
                // 绘制分钟标签
                ctx.fillStyle = '#888';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(minuteData.minute, x + CELL_W / 2, START_Y - 5);
            });
        }
        
        // 页面加载完成后渲染图表
        window.onload = function() {
            renderKline();
            renderFootprint();
            
            // 响应窗口大小变化
            window.onresize = function() {
                renderKline();
                renderFootprint();
            };
        };
    </script>
</body>
</html>
