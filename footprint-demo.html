<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Footprint + K线 一体图 Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      padding: 16px;
    }
    h2 {
      color: #888;
      font-size: 13px;
      font-weight: normal;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    canvas { display: block; }
    .legend {
      margin-top: 12px;
      display: flex;
      gap: 20px;
      color: #555;
      font-size: 11px;
      align-items: center;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 2px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<h2>605299.SH &nbsp;|&nbsp; 2026-04-10 &nbsp;|&nbsp; Footprint + 1min K线 一体图 [DEMO]</h2>
<canvas id="main-canvas"></canvas>

<div class="legend">
  <span><span class="legend-dot" style="background:#e24b4a"></span>卖方主导（delta &lt; 0）</span>
  <span><span class="legend-dot" style="background:#1d9e75"></span>买方主导（delta &gt; 0）</span>
  <span style="color:#444">格子格式：主动卖 × 主动买 &nbsp;|&nbsp; 底部数字 = 分钟 Delta</span>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// MOCK 数据（对应 API v2.0 契约，语义来自参考截图）
// ─────────────────────────────────────────────────────────────
const MOCK_MINUTES = [
  {
    minute: "09:30",
    kline: { open: 18.80, high: 18.83, low: 18.77, close: 18.78, volume: 3420 },
    minute_delta: -87,
    rows: [
      { price: 18.83, sell: 8,   buy: 22,  delta: 14  },
      { price: 18.82, sell: 87,  buy: 79,  delta: -8  },
      { price: 18.81, sell: 198, buy: 170, delta: -28 },
      { price: 18.80, sell: 59,  buy: 56,  delta: -3  },
      { price: 18.79, sell: 80,  buy: 67,  delta: -13 },
      { price: 18.78, sell: 23,  buy: 18,  delta: -5  },
      { price: 18.77, sell: 41,  buy: 37,  delta: -4  },
    ]
  },
  {
    minute: "09:31",
    kline: { open: 18.78, high: 18.85, low: 18.77, close: 18.84, volume: 4820 },
    minute_delta: 132,
    rows: [
      { price: 18.85, sell: 22,  buy: 64,  delta: 42  },
      { price: 18.84, sell: 31,  buy: 128, delta: 97  },
      { price: 18.83, sell: 18,  buy: 52,  delta: 34  },
      { price: 18.82, sell: 45,  buy: 38,  delta: -7  },
      { price: 18.81, sell: 12,  buy: 9,   delta: -3  },
      { price: 18.80, sell: 9,   buy: 18,  delta: 9   },
      { price: 18.77, sell: 6,   buy: 2,   delta: -4  },
    ]
  },
  {
    minute: "09:32",
    kline: { open: 18.84, high: 18.87, low: 18.83, close: 18.86, volume: 2910 },
    minute_delta: 55,
    rows: [
      { price: 18.87, sell: 15,  buy: 28,  delta: 13  },
      { price: 18.86, sell: 72,  buy: 98,  delta: 26  },
      { price: 18.85, sell: 44,  buy: 52,  delta: 8   },
      { price: 18.84, sell: 38,  buy: 46,  delta: 8   },
      { price: 18.83, sell: 19,  buy: 11,  delta: -8  },
    ]
  },
  {
    minute: "09:33",
    kline: { open: 18.86, high: 18.87, low: 18.82, close: 18.83, volume: 3650 },
    minute_delta: -63,
    rows: [
      { price: 18.87, sell: 28,  buy: 19,  delta: -9  },
      { price: 18.86, sell: 91,  buy: 72,  delta: -19 },
      { price: 18.85, sell: 56,  buy: 48,  delta: -8  },
      { price: 18.84, sell: 38,  buy: 29,  delta: -9  },
      { price: 18.83, sell: 42,  buy: 24,  delta: -18 },
      { price: 18.82, sell: 15,  buy: 11,  delta: -4  },
    ]
  },
  {
    minute: "09:34",
    kline: { open: 18.83, high: 18.86, low: 18.82, close: 18.85, volume: 3180 },
    minute_delta: 109,
    rows: [
      { price: 18.86, sell: 18,  buy: 55,  delta: 37  },
      { price: 18.85, sell: 25,  buy: 91,  delta: 66  },
      { price: 18.84, sell: 31,  buy: 34,  delta: 3   },
      { price: 18.83, sell: 22,  buy: 16,  delta: -6  },
      { price: 18.82, sell: 9,   buy: 10,  delta: 1   },
    ]
  }
];

// ─────────────────────────────────────────────────────────────
// 布局参数
// ─────────────────────────────────────────────────────────────
const N_COLS   = MOCK_MINUTES.length;
const COL_W    = 160;   // 每分钟列宽（K线蜡烛 + Footprint格子共用）
const PAD_L    = 56;    // 左侧价格轴
const PAD_R    = 16;
const PAD_T    = 32;    // 顶部时间标签
const PAD_BOT  = 56;    // 底部：Volume区 + Delta标签
const VOL_H    = 36;    // 成交量柱高度区域

// 价格坐标系
// 收集所有价格（K线高低 + Footprint各行价格），统一定价格轴
function buildPriceAxis() {
  const prices = new Set();
  MOCK_MINUTES.forEach(m => {
    // K线高低之间每 0.01 一格（确保蜡烛完整覆盖）
    let p = Math.round(m.kline.low  * 100);
    const hi = Math.round(m.kline.high * 100);
    while (p <= hi) { prices.add(p / 100); p++; }
    // Footprint 行价格
    m.rows.forEach(r => prices.add(Math.round(r.price * 100) / 100));
  });
  return Array.from(prices).sort((a, b) => b - a); // 高 → 低
}

const ALL_PRICES = buildPriceAxis();
const PRICE_MAX  = ALL_PRICES[0];
const PRICE_MIN  = ALL_PRICES[ALL_PRICES.length - 1];

// 每个价格档的像素高度（动态计算，保证图表合适高度）
const CELL_H = 20;
const CHART_H = ALL_PRICES.length * CELL_H; // 价格区总高度

const CANVAS_W = PAD_L + N_COLS * COL_W + PAD_R;
const CANVAS_H = PAD_T + CHART_H + PAD_BOT;

// 价格 → Y坐标（价格行顶部）
function priceToY(price) {
  const idx = ALL_PRICES.findIndex(p => Math.abs(p - price) < 0.001);
  if (idx < 0) {
    // 插值：按比例
    return PAD_T + (PRICE_MAX - price) / (PRICE_MAX - PRICE_MIN) * CHART_H;
  }
  return PAD_T + idx * CELL_H;
}

// 价格 → Y坐标（中心线，用于K线影线）
function priceToYCenter(price) {
  return PAD_T + (PRICE_MAX - price) / (PRICE_MAX - PRICE_MIN + 0.01) * CHART_H;
}

// 列左边X坐标
function colX(ci) {
  return PAD_L + ci * COL_W;
}

// ─────────────────────────────────────────────────────────────
// 颜色工具
// ─────────────────────────────────────────────────────────────
const UP_RGB   = [29,  158, 117];
const DOWN_RGB = [226, 75,  74];
const NEUT_RGB = [70,  70,  80];

function rgba(rgb, a) {
  return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
}

// ─────────────────────────────────────────────────────────────
// 主渲染函数
// ─────────────────────────────────────────────────────────────
function render() {
  const canvas = document.getElementById('main-canvas');
  canvas.width  = CANVAS_W;
  canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d');

  // ── 背景 ──────────────────────────────────────────────────
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // ── 水平网格线（每个价格档） ──────────────────────────────
  ctx.strokeStyle = '#252538';
  ctx.lineWidth = 0.5;
  ALL_PRICES.forEach((_, ri) => {
    const y = PAD_T + ri * CELL_H;
    ctx.beginPath();
    ctx.moveTo(PAD_L, y);
    ctx.lineTo(CANVAS_W - PAD_R, y);
    ctx.stroke();
  });
  // 底边线
  ctx.beginPath();
  ctx.moveTo(PAD_L, PAD_T + CHART_H);
  ctx.lineTo(CANVAS_W - PAD_R, PAD_T + CHART_H);
  ctx.stroke();

  // ── 左侧价格轴 ────────────────────────────────────────────
  ctx.fillStyle = '#444';
  ctx.font = '10px Consolas';
  ctx.textAlign = 'right';
  // 只显示部分价格标签（每隔2档显示一个，避免拥挤）
  ALL_PRICES.forEach((price, ri) => {
    if (ri % 2 === 0) {
      const y = PAD_T + ri * CELL_H + CELL_H / 2 + 3;
      ctx.fillStyle = '#444';
      ctx.fillText(price.toFixed(2), PAD_L - 4, y);
    }
  });

  // ── 顶部时间标签 ──────────────────────────────────────────
  ctx.fillStyle = '#666';
  ctx.font = '11px Consolas';
  ctx.textAlign = 'center';
  MOCK_MINUTES.forEach((m, ci) => {
    ctx.fillText(m.minute, colX(ci) + COL_W / 2, PAD_T - 10);
  });

  // ── 垂直列分隔线 ─────────────────────────────────────────
  ctx.strokeStyle = '#2a2a3e';
  ctx.lineWidth = 1;
  MOCK_MINUTES.forEach((_, ci) => {
    const x = colX(ci);
    ctx.beginPath();
    ctx.moveTo(x, PAD_T);
    ctx.lineTo(x, PAD_T + CHART_H);
    ctx.stroke();
  });

  // ── 每分钟：先画 Footprint 格子，再叠加 K线蜡烛 ──────────
  MOCK_MINUTES.forEach((m, ci) => {
    const cx = colX(ci);
    const maxAbs = Math.max(...m.rows.map(r => Math.abs(r.delta)), 1);

    // ── Step 1: Footprint 格子（底层）──────────────────────
    m.rows.forEach(row => {
      const cellY = priceToY(row.price);

      const intensity = Math.abs(row.delta) / maxAbs;
      const alpha     = 0.18 + intensity * 0.72;
      const color     = row.delta > 0 ? UP_RGB
                      : row.delta < 0 ? DOWN_RGB
                      : NEUT_RGB;

      // 格子背景
      ctx.fillStyle = rgba(color, alpha);
      ctx.fillRect(cx + 1, cellY + 0.5, COL_W - 2, CELL_H - 1);

      // 最大 |delta| 行加边框
      if (Math.abs(row.delta) === maxAbs) {
        ctx.strokeStyle = rgba(color, 0.95);
        ctx.lineWidth   = 1.5;
        ctx.strokeRect(cx + 1.75, cellY + 1, COL_W - 3.5, CELL_H - 2);
      }

      // 格子文字：sell × buy
      const midY = cellY + CELL_H / 2 + 4;

      // sell（左对齐）
      ctx.font      = '11px Consolas';
      ctx.fillStyle = '#ddd';
      ctx.textAlign = 'left';
      ctx.fillText(row.sell, cx + 6, midY);

      // ×（居中）
      ctx.fillStyle = '#555';
      ctx.textAlign = 'center';
      ctx.fillText('×', cx + COL_W / 2, midY);

      // buy（右对齐，颜色跟随方向）
      ctx.fillStyle = row.delta > 0 ? rgba(UP_RGB, 1)
                    : row.delta < 0 ? rgba(DOWN_RGB, 1)
                    : '#888';
      ctx.textAlign = 'right';
      ctx.fillText(row.buy, cx + COL_W - 6, midY);
    });

    // ── Step 2: K线蜡烛（叠加在 Footprint 上层）──────────
    const k   = m.kline;
    const up  = k.close >= k.open;
    const kColor = up ? rgba(UP_RGB, 0.95) : rgba(DOWN_RGB, 0.95);

    const candleCX = cx + COL_W / 2;  // 蜡烛中心X

    // 影线（使用精确价格→Y映射）
    const highY  = priceToYCenter(k.high);
    const lowY   = priceToYCenter(k.low);
    const openY  = priceToYCenter(k.open);
    const closeY = priceToYCenter(k.close);

    ctx.strokeStyle = kColor;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(candleCX, highY);
    ctx.lineTo(candleCX, lowY);
    ctx.stroke();

    // 实体（宽度 = COL_W * 0.35，保留两侧给Footprint文字）
    const bodyTop = Math.min(openY, closeY);
    const bodyH   = Math.max(Math.abs(openY - closeY), 2);
    const bodyW   = COL_W * 0.35;

    ctx.fillStyle = kColor;
    ctx.fillRect(candleCX - bodyW / 2, bodyTop, bodyW, bodyH);

    // 实体描边（让蜡烛在格子上更突出）
    ctx.strokeStyle = up ? rgba(UP_RGB, 1) : rgba(DOWN_RGB, 1);
    ctx.lineWidth   = 1;
    ctx.strokeRect(candleCX - bodyW / 2, bodyTop, bodyW, bodyH);
  });

  // ── 成交量柱（价格区下方独立区域）──────────────────────
  const volTop    = PAD_T + CHART_H + 8;
  const maxVol    = Math.max(...MOCK_MINUTES.map(m => m.kline.volume));

  MOCK_MINUTES.forEach((m, ci) => {
    const cx   = colX(ci);
    const up   = m.kline.close >= m.kline.open;
    const volH = (m.kline.volume / maxVol) * VOL_H;

    ctx.fillStyle = up ? rgba(UP_RGB, 0.5) : rgba(DOWN_RGB, 0.5);
    ctx.fillRect(
      cx + COL_W * 0.15,
      volTop + VOL_H - volH,
      COL_W * 0.7,
      volH
    );
  });

  // "Volume" 标签
  ctx.fillStyle = '#333';
  ctx.font      = '10px Consolas';
  ctx.textAlign = 'center';
  ctx.fillText('Volume', PAD_L + (N_COLS * COL_W) / 2, volTop + VOL_H + 12);

  // ── 底部分钟 Delta ────────────────────────────────────────
  const deltaY = volTop + VOL_H + 28;

  MOCK_MINUTES.forEach((m, ci) => {
    const cx = colX(ci) + COL_W / 2;
    ctx.font      = 'bold 12px Consolas';
    ctx.textAlign = 'center';
    ctx.fillStyle = m.minute_delta > 0 ? rgba(UP_RGB, 1) : rgba(DOWN_RGB, 1);
    ctx.fillText(
      (m.minute_delta > 0 ? '+' : '') + m.minute_delta,
      cx,
      deltaY
    );
  });
}

render();
</script>
</body>
</html>
