<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Footprint Demo — 蜡烛|卖方|买方</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141420;
      color: #e0e0e0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      padding: 16px;
    }
    h2 {
      color: #555;
      font-size: 12px;
      font-weight: normal;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    #chart-scroll {
      overflow-x: auto;
    }
    canvas { display: block; }
    .legend {
      margin-top: 10px;
      display: flex;
      gap: 18px;
      color: #444;
      font-size: 11px;
    }
    .ld {
      width: 10px; height: 10px; border-radius: 2px;
      display: inline-block; margin-right: 4px; vertical-align: middle;
    }
  </style>
</head>
<body>

<h2>605299.SH &nbsp;|&nbsp; 2026-04-10 &nbsp;|&nbsp; Footprint 订单流 [DEMO]</h2>
<div id="chart-scroll">
  <canvas id="main-canvas"></canvas>
</div>
<div class="legend">
  <span><span class="ld" style="background:#e24b4a"></span>卖方（中间列，sell×buy）</span>
  <span><span class="ld" style="background:#1d9e75"></span>买方（右侧列，buy×sell）</span>
  <span>底部数字 = 分钟 Delta</span>
</div>

<script>
// ─────────────────────────────────────────
// MOCK 数据（API v2.0）
// ─────────────────────────────────────────
const MOCK_MINUTES = [
  {
    minute: "09:30",
    kline: { open: 18.80, high: 18.83, low: 18.77, close: 18.78, volume: 3420 },
    minute_delta: -87,
    rows: [
      { price: 18.83, sell: 8,   buy: 22,  delta: 14  },
      { price: 18.82, sell: 87,  buy: 79,  delta: -8  },
      { price: 18.81, sell: 198, buy: 170, delta: -28 },
      { price: 18.80, sell: 59,  buy: 56,  delta: -3  },
      { price: 18.79, sell: 83,  buy: 66,  delta: -17 },
      { price: 18.78, sell: 28,  buy: 22,  delta: -6  },
      { price: 18.77, sell: 23,  buy: 18,  delta: -5  },
    ]
  },
  {
    minute: "09:31",
    kline: { open: 18.78, high: 18.85, low: 18.77, close: 18.84, volume: 4820 },
    minute_delta: 132,
    rows: [
      { price: 18.85, sell: 22,  buy: 64,  delta: 42  },
      { price: 18.84, sell: 31,  buy: 128, delta: 97  },
      { price: 18.83, sell: 18,  buy: 52,  delta: 34  },
      { price: 18.82, sell: 45,  buy: 38,  delta: -7  },
      { price: 18.81, sell: 12,  buy: 9,   delta: -3  },
      { price: 18.80, sell: 9,   buy: 18,  delta: 9   },
      { price: 18.77, sell: 6,   buy: 2,   delta: -4  },
    ]
  },
  {
    minute: "09:32",
    kline: { open: 18.84, high: 18.87, low: 18.83, close: 18.86, volume: 2910 },
    minute_delta: 55,
    rows: [
      { price: 18.87, sell: 15,  buy: 28,  delta: 13  },
      { price: 18.86, sell: 72,  buy: 98,  delta: 26  },
      { price: 18.85, sell: 44,  buy: 52,  delta: 8   },
      { price: 18.84, sell: 38,  buy: 46,  delta: 8   },
      { price: 18.83, sell: 19,  buy: 11,  delta: -8  },
    ]
  },
  {
    minute: "09:33",
    kline: { open: 18.86, high: 18.87, low: 18.82, close: 18.83, volume: 3650 },
    minute_delta: -63,
    rows: [
      { price: 18.87, sell: 28,  buy: 19,  delta: -9  },
      { price: 18.86, sell: 91,  buy: 72,  delta: -19 },
      { price: 18.85, sell: 56,  buy: 48,  delta: -8  },
      { price: 18.84, sell: 38,  buy: 29,  delta: -9  },
      { price: 18.83, sell: 42,  buy: 24,  delta: -18 },
      { price: 18.82, sell: 15,  buy: 11,  delta: -4  },
    ]
  },
  {
    minute: "09:34",
    kline: { open: 18.83, high: 18.86, low: 18.82, close: 18.85, volume: 3180 },
    minute_delta: 109,
    rows: [
      { price: 18.86, sell: 18,  buy: 55,  delta: 37  },
      { price: 18.85, sell: 25,  buy: 91,  delta: 66  },
      { price: 18.84, sell: 31,  buy: 34,  delta: 3   },
      { price: 18.83, sell: 22,  buy: 16,  delta: -6  },
      { price: 18.82, sell: 9,   buy: 10,  delta: 1   },
    ]
  }
];

// ─────────────────────────────────────────
// 全局价格轴
// ─────────────────────────────────────────
function buildPriceAxis() {
  const set = new Set();
  MOCK_MINUTES.forEach(m => {
    let p = Math.round(m.kline.low * 100);
    const hi = Math.round(m.kline.high * 100);
    while (p <= hi) { set.add(p / 100); p++; }
    m.rows.forEach(r => set.add(Math.round(r.price * 100) / 100));
  });
  return Array.from(set).sort((a, b) => b - a);
}

const ALL_PRICES = buildPriceAxis();
const N_ROWS     = ALL_PRICES.length;

// ─────────────────────────────────────────
// 布局参数
// 每分钟 = 蜡烛列(左) + 卖方列(中) + 买方列(右)
// ─────────────────────────────────────────
const CELL_H    = 20;   // 每价格行高
const CANDLE_W  = 56;   // 左：蜡烛列宽
const SELL_W    = 108;  // 中：卖方列宽
const BUY_W     = 108;  // 右：买方列宽
const COL_W     = CANDLE_W + SELL_W + BUY_W;  // 272px
const COL_GAP   = 3;
const PAD_L     = 52;   // 价格轴标签
const PAD_TOP   = 28;
const PAD_BOT   = 52;
const VOL_H     = 34;

const CANVAS_W  = PAD_L + MOCK_MINUTES.length * (COL_W + COL_GAP);
const CANVAS_H  = PAD_TOP + N_ROWS * CELL_H + PAD_BOT;

// 颜色
const SELL_RGB = [226, 75,  74 ];
const BUY_RGB  = [29,  158, 117];
const NEUT_RGB = [80,  80,  95 ];

function rgba([r, g, b], a) {
  return `rgba(${r},${g},${b},${a})`;
}

function priceIdx(price) {
  return ALL_PRICES.findIndex(p => Math.abs(p - price) < 0.0005);
}
function rowTopY(price) {
  const i = priceIdx(price);
  return i < 0 ? -1 : PAD_TOP + i * CELL_H;
}
function rowMidY(price) {
  const i = priceIdx(price);
  return i < 0 ? -1 : PAD_TOP + i * CELL_H + CELL_H / 2;
}

// 第 ci 分钟：蜡烛列起始 X
function candleColX(ci) { return PAD_L + ci * (COL_W + COL_GAP); }
function sellColX(ci)   { return candleColX(ci) + CANDLE_W; }
function buyColX(ci)    { return candleColX(ci) + CANDLE_W + SELL_W; }

// ─────────────────────────────────────────
// 渲染
// ─────────────────────────────────────────
function render() {
  const canvas = document.getElementById('main-canvas');
  canvas.width  = CANVAS_W;
  canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#141420';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // 价格轴标签（左侧）
  ctx.font = '10px Consolas';
  ctx.textAlign = 'right';
  ALL_PRICES.forEach((price, i) => {
    if (i % 2 === 0) {
      ctx.fillStyle = '#3a3a55';
      ctx.fillText(price.toFixed(2), PAD_L - 4, PAD_TOP + i * CELL_H + CELL_H / 2 + 3);
    }
  });

  // 水平网格线
  ALL_PRICES.forEach((_, i) => {
    const y = PAD_TOP + i * CELL_H;
    ctx.strokeStyle = '#1c1c2e';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(PAD_L, y);
    ctx.lineTo(CANVAS_W, y);
    ctx.stroke();
  });
  // 价格区底部边线
  ctx.strokeStyle = '#2a2a40';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD_L, PAD_TOP + N_ROWS * CELL_H);
  ctx.lineTo(CANVAS_W, PAD_TOP + N_ROWS * CELL_H);
  ctx.stroke();

  MOCK_MINUTES.forEach((m, ci) => {
    const cx  = candleColX(ci);
    const sx  = sellColX(ci);
    const bx  = buyColX(ci);
    const maxAbs = Math.max(...m.rows.map(r => Math.abs(r.delta)), 1);

    // 时间标签（列顶部居中）
    ctx.fillStyle = '#555';
    ctx.font = '11px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(m.minute, cx + COL_W / 2, PAD_TOP - 8);

    // ── Footprint 格子 ──────────────────────
    m.rows.forEach(row => {
      const ry = rowTopY(row.price);
      if (ry < 0) return;

      const intensity = Math.abs(row.delta) / maxAbs;
      const alpha     = 0.14 + intensity * 0.76;
      const isMax     = Math.abs(row.delta) === maxAbs;
      const midY      = ry + CELL_H / 2 + 4;

      // 卖方格子（中间列）—— 红色系
      const sellBg = row.delta < 0 ? SELL_RGB : row.delta > 0 ? BUY_RGB : NEUT_RGB;
      ctx.fillStyle = rgba(sellBg, alpha);
      ctx.fillRect(sx + 1, ry + 0.5, SELL_W - 2, CELL_H - 1);

      // 买方格子（右侧列）—— 绿色系
      const buyBg = row.delta > 0 ? BUY_RGB : row.delta < 0 ? SELL_RGB : NEUT_RGB;
      ctx.fillStyle = rgba(buyBg, alpha * 0.85);
      ctx.fillRect(bx + 1, ry + 0.5, BUY_W - 2, CELL_H - 1);

      // 最大量行边框
      if (isMax) {
        const bc = row.delta >= 0 ? BUY_RGB : SELL_RGB;
        ctx.strokeStyle = rgba(bc, 0.9);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(sx + 1.75, ry + 1, SELL_W - 3.5, CELL_H - 2);
        ctx.strokeRect(bx + 1.75, ry + 1, BUY_W - 3.5, CELL_H - 2);
      }

      ctx.lineWidth = 1;
      ctx.font = '11px Consolas';

      // 卖方文字：sell × buy（中间列）
      ctx.fillStyle = rgba(SELL_RGB, 0.9);
      ctx.textAlign = 'left';
      ctx.fillText(row.sell, sx + 5, midY);
      ctx.fillStyle = '#3a3a55';
      ctx.textAlign = 'center';
      ctx.fillText('×', sx + SELL_W / 2, midY);
      ctx.fillStyle = '#bbb';
      ctx.textAlign = 'right';
      ctx.fillText(row.buy, sx + SELL_W - 5, midY);

      // 买方文字：buy × sell（右侧列）
      ctx.fillStyle = rgba(BUY_RGB, 0.9);
      ctx.textAlign = 'left';
      ctx.fillText(row.buy, bx + 5, midY);
      ctx.fillStyle = '#3a3a55';
      ctx.textAlign = 'center';
      ctx.fillText('×', bx + BUY_W / 2, midY);
      ctx.fillStyle = '#bbb';
      ctx.textAlign = 'right';
      ctx.fillText(row.sell, bx + BUY_W - 5, midY);
    });

    // ── K线蜡烛（左侧列）─────────────────────
    const { open, close, high, low } = m.kline;
    const up    = close >= open;
    const color = up ? rgba(BUY_RGB, 1) : rgba(SELL_RGB, 1);
    const ccx   = cx + CANDLE_W / 2;  // 蜡烛中心 X
    const bw    = CANDLE_W * 0.52;    // 实体宽

    const bodyT = Math.min(rowMidY(open), rowMidY(close));
    const bodyB = Math.max(rowMidY(open), rowMidY(close));
    const bodyH = Math.max(bodyB - bodyT, 2);

    // 影线
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ccx, rowMidY(high)); ctx.lineTo(ccx, bodyT); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ccx, bodyB); ctx.lineTo(ccx, rowMidY(low)); ctx.stroke();

    // 实体
    ctx.fillStyle = color;
    ctx.fillRect(ccx - bw / 2, bodyT, bw, bodyH);

    // ── 成交量柱（价格区正下方，蜡烛列居中）──
    const volAreaTop = PAD_TOP + N_ROWS * CELL_H + 5;
    const maxVol     = Math.max(...MOCK_MINUTES.map(d => d.kline.volume));
    const barH       = (m.kline.volume / maxVol) * (VOL_H - 6);
    ctx.fillStyle    = up ? rgba(BUY_RGB, 0.45) : rgba(SELL_RGB, 0.45);
    ctx.fillRect(cx + CANDLE_W * 0.12, volAreaTop + (VOL_H - 6) - barH, CANDLE_W * 0.76, barH);

    // ── 分钟 Delta（卖方列底部）──────────────
    const deltaY = PAD_TOP + N_ROWS * CELL_H + VOL_H + 18;
    ctx.font      = 'bold 12px Consolas';
    ctx.textAlign = 'center';
    ctx.fillStyle = m.minute_delta > 0 ? rgba(BUY_RGB, 1) : rgba(SELL_RGB, 1);
    ctx.fillText(
      (m.minute_delta > 0 ? '+' : '') + m.minute_delta,
      sx + SELL_W / 2,
      deltaY
    );

    // ── 列分隔线 ─────────────────────────────
    ctx.strokeStyle = '#1e1e32';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + COL_W + COL_GAP / 2, PAD_TOP - 20);
    ctx.lineTo(cx + COL_W + COL_GAP / 2, PAD_TOP + N_ROWS * CELL_H + PAD_BOT - 4);
    ctx.stroke();
  });
}

render();
</script>
</body>
</html>
