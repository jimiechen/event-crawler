<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Footprint — ECharts custom 实现</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #141420; color: #e0e0e0; font-family: Consolas, monospace; padding: 16px; }
    h2   { color: #555; font-size: 12px; font-weight: normal; margin-bottom: 10px; }
    #chart { width: 100%; height: 560px; }
    .legend { margin-top: 8px; display: flex; gap: 16px; font-size: 11px; color: #444; }
    .ld { width: 10px; height: 10px; border-radius: 2px; display: inline-block;
          margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>

<h2>605299.SH &nbsp;|&nbsp; 2026-04-10 &nbsp;|&nbsp; Footprint 订单流 — ECharts custom [DEMO]</h2>
<div id="chart"></div>
<div class="legend">
  <span><span class="ld" style="background:#e24b4a"></span>卖方（中列 sell×buy）</span>
  <span><span class="ld" style="background:#1d9e75"></span>买方（右列 buy×sell）</span>
  <span>底部数字 = 分钟 Delta</span>
</div>

<script>
// ─────────────────────────────────────────────
// MOCK 数据（API v2.0 契约）
// ─────────────────────────────────────────────
const MOCK_MINUTES = [
  {
    minute: "09:30", minute_delta: -87,
    kline: { open: 18.80, high: 18.83, low: 18.77, close: 18.78, volume: 3420 },
    rows: [
      { price: 18.83, sell: 8,   buy: 22,  delta: 14  },
      { price: 18.82, sell: 87,  buy: 79,  delta: -8  },
      { price: 18.81, sell: 198, buy: 170, delta: -28 },
      { price: 18.80, sell: 59,  buy: 56,  delta: -3  },
      { price: 18.79, sell: 83,  buy: 66,  delta: -17 },
      { price: 18.78, sell: 28,  buy: 22,  delta: -6  },
      { price: 18.77, sell: 23,  buy: 18,  delta: -5  },
    ]
  },
  {
    minute: "09:31", minute_delta: 132,
    kline: { open: 18.78, high: 18.85, low: 18.77, close: 18.84, volume: 4820 },
    rows: [
      { price: 18.85, sell: 22,  buy: 64,  delta: 42  },
      { price: 18.84, sell: 31,  buy: 128, delta: 97  },
      { price: 18.83, sell: 18,  buy: 52,  delta: 34  },
      { price: 18.82, sell: 45,  buy: 38,  delta: -7  },
      { price: 18.81, sell: 12,  buy: 9,   delta: -3  },
      { price: 18.80, sell: 9,   buy: 18,  delta: 9   },
      { price: 18.77, sell: 6,   buy: 2,   delta: -4  },
    ]
  },
  {
    minute: "09:32", minute_delta: 55,
    kline: { open: 18.84, high: 18.87, low: 18.83, close: 18.86, volume: 2910 },
    rows: [
      { price: 18.87, sell: 15,  buy: 28,  delta: 13  },
      { price: 18.86, sell: 72,  buy: 98,  delta: 26  },
      { price: 18.85, sell: 44,  buy: 52,  delta: 8   },
      { price: 18.84, sell: 38,  buy: 46,  delta: 8   },
      { price: 18.83, sell: 19,  buy: 11,  delta: -8  },
    ]
  },
  {
    minute: "09:33", minute_delta: -63,
    kline: { open: 18.86, high: 18.87, low: 18.82, close: 18.83, volume: 3650 },
    rows: [
      { price: 18.87, sell: 28,  buy: 19,  delta: -9  },
      { price: 18.86, sell: 91,  buy: 72,  delta: -19 },
      { price: 18.85, sell: 56,  buy: 48,  delta: -8  },
      { price: 18.84, sell: 38,  buy: 29,  delta: -9  },
      { price: 18.83, sell: 42,  buy: 24,  delta: -18 },
      { price: 18.82, sell: 15,  buy: 11,  delta: -4  },
    ]
  },
  {
    minute: "09:34", minute_delta: 109,
    kline: { open: 18.83, high: 18.86, low: 18.82, close: 18.85, volume: 3180 },
    rows: [
      { price: 18.86, sell: 18,  buy: 55,  delta: 37  },
      { price: 18.85, sell: 25,  buy: 91,  delta: 66  },
      { price: 18.84, sell: 31,  buy: 34,  delta: 3   },
      { price: 18.83, sell: 22,  buy: 16,  delta: -6  },
      { price: 18.82, sell: 9,   buy: 10,  delta: 1   },
    ]
  }
];

// ─────────────────────────────────────────────
// 全局价格轴（所有分钟的所有价格，高→低）
// ─────────────────────────────────────────────
const priceSet = new Set();
MOCK_MINUTES.forEach(m => {
  let p = Math.round(m.kline.low * 100);
  while (p <= Math.round(m.kline.high * 100)) { priceSet.add(p / 100); p++; }
  m.rows.forEach(r => priceSet.add(Math.round(r.price * 100) / 100));
});
const ALL_PRICES = Array.from(priceSet).sort((a, b) => a - b); // 低→高（ECharts Y轴方向）

// ─────────────────────────────────────────────
// 布局常量
// 每分钟 X 轴占 3 个"槽位"：蜡烛槽 | 卖方槽 | 买方槽
// X 轴类目 = 分钟时间字符串，每分钟内部用坐标偏移区分三列
// ─────────────────────────────────────────────
const SELL_COLOR  = '#e24b4a';
const BUY_COLOR   = '#1d9e75';
const NEUT_COLOR  = '#505060';

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function withAlpha(hex, a) {
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// ─────────────────────────────────────────────
// 构建 custom series data
// 每个 data item 描述一个"分钟列"的完整渲染
// ─────────────────────────────────────────────
const seriesData = MOCK_MINUTES.map((m, ci) => ({
  value: [ci, m],   // x=分钟索引, value=完整分钟数据
  minuteIdx: ci,
}));

// ─────────────────────────────────────────────
// ECharts custom renderItem
// 参数：params.coordSys 提供坐标系转换
// ─────────────────────────────────────────────
function renderFootprintItem(params, api) {
  const ci = api.value(0);         // 分钟索引（X轴）
  const m  = api.value(1);         // 完整分钟数据

  const group = { type: 'group', children: [] };

  // 每分钟列的 X 中心（由 ECharts 坐标系给出）
  const xCenter = api.coord([ci, ALL_PRICES[0]])[0];

  // 估算每个分钟列的像素宽度
  // （相邻两个分钟中心距 × 0.9 作为列总宽）
  let colPxW = 260; // fallback
  if (MOCK_MINUTES.length > 1) {
    const x0 = api.coord([0, ALL_PRICES[0]])[0];
    const x1 = api.coord([1, ALL_PRICES[0]])[0];
    colPxW = Math.abs(x1 - x0) * 0.92;
  }

  // 三列宽度分配比例：蜡烛15% | 卖方42.5% | 买方42.5%
  const candleW = colPxW * 0.15;
  const sideW   = colPxW * 0.425;

  // 三列左边 X
  const candleLeft = xCenter - colPxW / 2;
  const sellLeft   = candleLeft + candleW;
  const buyLeft    = sellLeft + sideW;

  // 每个价格行的像素高度
  const yTop    = api.coord([ci, ALL_PRICES[ALL_PRICES.length - 1]])[1];
  const yBottom = api.coord([ci, ALL_PRICES[0]])[1];
  const totalPxH = Math.abs(yBottom - yTop);
  const cellH   = totalPxH / (ALL_PRICES.length - 1 || 1);

  const maxAbs = Math.max(...m.rows.map(r => Math.abs(r.delta)), 1);

  // ── Footprint 格子 ──────────────────────────
  m.rows.forEach(row => {
    const [, rowY] = api.coord([ci, row.price]);
    const ry = rowY - cellH / 2;  // 格子顶部 Y

    const intensity = Math.abs(row.delta) / maxAbs;
    const alpha     = 0.13 + intensity * 0.77;
    const isMax     = Math.abs(row.delta) === maxAbs;

    const sellBg = row.delta < 0 ? SELL_COLOR : row.delta > 0 ? BUY_COLOR : NEUT_COLOR;
    const buyBg  = row.delta > 0 ? BUY_COLOR  : row.delta < 0 ? SELL_COLOR : NEUT_COLOR;

    // 卖方格子（中列）
    group.children.push({
      type: 'rect',
      shape: { x: sellLeft, y: ry, width: sideW - 1, height: cellH - 1 },
      style: { fill: withAlpha(sellBg, alpha), stroke: isMax ? withAlpha(sellBg, 0.9) : 'none', lineWidth: 1.5 }
    });

    // 买方格子（右列）
    group.children.push({
      type: 'rect',
      shape: { x: buyLeft, y: ry, width: sideW - 1, height: cellH - 1 },
      style: { fill: withAlpha(buyBg, alpha * 0.85), stroke: isMax ? withAlpha(buyBg, 0.9) : 'none', lineWidth: 1.5 }
    });

    const textY = ry + cellH / 2 + 4;
    const fs    = Math.min(11, Math.max(9, cellH * 0.55));

    // 卖方文字：sell × buy
    group.children.push({ type: 'text', style: {
      text: String(row.sell), x: sellLeft + 4, y: textY,
      fill: withAlpha(SELL_COLOR, 0.95), fontSize: fs, fontFamily: 'Consolas', textAlign: 'left'
    }});
    group.children.push({ type: 'text', style: {
      text: '×', x: sellLeft + sideW / 2, y: textY,
      fill: '#333', fontSize: fs, fontFamily: 'Consolas', textAlign: 'center'
    }});
    group.children.push({ type: 'text', style: {
      text: String(row.buy), x: sellLeft + sideW - 4, y: textY,
      fill: '#aaa', fontSize: fs, fontFamily: 'Consolas', textAlign: 'right'
    }});

    // 买方文字：buy × sell
    group.children.push({ type: 'text', style: {
      text: String(row.buy), x: buyLeft + 4, y: textY,
      fill: withAlpha(BUY_COLOR, 0.95), fontSize: fs, fontFamily: 'Consolas', textAlign: 'left'
    }});
    group.children.push({ type: 'text', style: {
      text: '×', x: buyLeft + sideW / 2, y: textY,
      fill: '#333', fontSize: fs, fontFamily: 'Consolas', textAlign: 'center'
    }});
    group.children.push({ type: 'text', style: {
      text: String(row.sell), x: buyLeft + sideW - 4, y: textY,
      fill: '#aaa', fontSize: fs, fontFamily: 'Consolas', textAlign: 'right'
    }});
  });

  // ── K线蜡烛（左列）──────────────────────────
  const { open, close, high, low } = m.kline;
  const up    = close >= open;
  const kColor = up ? BUY_COLOR : SELL_COLOR;
  const ccx   = candleLeft + candleW / 2;
  const bw    = candleW * 0.6;

  const [, yOpen]  = api.coord([ci, open]);
  const [, yClose] = api.coord([ci, close]);
  const [, yHigh]  = api.coord([ci, high]);
  const [, yLow]   = api.coord([ci, low]);

  const bodyTop = Math.min(yOpen, yClose);
  const bodyH   = Math.max(Math.abs(yClose - yOpen), 2);

  // 影线
  group.children.push({ type: 'line',
    shape: { x1: ccx, y1: yHigh, x2: ccx, y2: bodyTop },
    style: { stroke: kColor, lineWidth: 1.5 }
  });
  group.children.push({ type: 'line',
    shape: { x1: ccx, y1: bodyTop + bodyH, x2: ccx, y2: yLow },
    style: { stroke: kColor, lineWidth: 1.5 }
  });

  // 实体
  group.children.push({ type: 'rect',
    shape: { x: ccx - bw / 2, y: bodyTop, width: bw, height: bodyH },
    style: { fill: kColor }
  });

  // ── 分钟 Delta 标签（卖方列底部）────────────
  const deltaColor = m.minute_delta > 0 ? BUY_COLOR : SELL_COLOR;
  const deltaText  = (m.minute_delta > 0 ? '+' : '') + m.minute_delta;
  group.children.push({ type: 'text', style: {
    text: deltaText,
    x: sellLeft + sideW / 2,
    y: yBottom + 18,
    fill: deltaColor,
    fontSize: 12,
    fontWeight: 'bold',
    fontFamily: 'Consolas',
    textAlign: 'center'
  }});

  // ── 列分隔线 ────────────────────────────────
  group.children.push({ type: 'line',
    shape: { x1: candleLeft - 1, y1: yTop - 10, x2: candleLeft - 1, y2: yBottom + 30 },
    style: { stroke: '#1e1e32', lineWidth: 1 }
  });

  return group;
}

// ─────────────────────────────────────────────
// ECharts option
// ─────────────────────────────────────────────
const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

chart.setOption({
  backgroundColor: '#141420',
  animation: false,
  grid: { left: 60, right: 20, top: 30, bottom: 60 },
  xAxis: {
    type: 'category',
    data: MOCK_MINUTES.map(m => m.minute),
    axisLine:  { lineStyle: { color: '#2a2a3e' } },
    axisLabel: { color: '#555', fontFamily: 'Consolas', fontSize: 11 },
    splitLine: { show: false },
    axisTick:  { show: false }
  },
  yAxis: {
    type: 'value',
    min: Math.min(...ALL_PRICES) - 0.01,
    max: Math.max(...ALL_PRICES) + 0.01,
    scale: false,
    axisLabel: {
      color: '#3a3a55',
      fontFamily: 'Consolas',
      fontSize: 10,
      formatter: v => v.toFixed(2)
    },
    splitLine: { lineStyle: { color: '#1c1c2e', width: 0.5 } },
    axisLine: { show: false }
  },
  series: [{
    type: 'custom',
    renderItem: renderFootprintItem,
    data: MOCK_MINUTES.map((m, ci) => [ci, m]),
    encode: { x: 0, y: 1 },
    z: 10
  }]
});

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
