<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数组模块专项测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; }
        .success { border-color: #28a745; background: #d4edda; }
        .error { border-color: #dc3545; background: #f8d7da; }
    </style>
</head>
<body>
    <h1>🔧 数组模块专项测试</h1>
    <button onclick="testArrayModules()">🚀 测试数组模块</button>
    <div id="results"></div>

    <script>
        // 模拟测试数据
        const mockData = `
            <div id="home-recent-matches">
                <tr data-matchid="12345">
                    <td>2024-01-15</td>
                    <td>主队 vs 客队</td>
                    <td>2-1</td>
                    <td>胜</td>
                </tr>
                <tr data-matchid="12346">
                    <td>2024-01-10</td>
                    <td>主队 vs 其他</td>
                    <td>1-0</td>
                    <td>胜</td>
                </tr>
            </div>
            
            <div id="away-recent-matches">
                <tr data-matchid="12347">
                    <td>2024-01-08</td>
                    <td>客队 vs 其他</td>
                    <td>0-2</td>
                    <td>负</td>
                </tr>
            </div>
        `;

        // 简化的正则配置
        const regexConfig = {
            home_recent_match_id: /data-matchid="([^"]+)"/,
            home_recent_date: /<td>(\d{4}-\d{2}-\d{2})<\/td>/,
            home_recent_teams: /<td>([^<]+vs[^<]+)<\/td>/,
            home_recent_score: /<td>(\d+-\d+)<\/td>/,
            home_recent_result: /<td>(胜|负|平)<\/td>/,
            
            away_recent_match_id: /data-matchid="([^"]+)"/,
            away_recent_date: /<td>(\d{4}-\d{2}-\d{2})<\/td>/,
            away_recent_teams: /<td>([^<]+vs[^<]+)<\/td>/,
            away_recent_score: /<td>(\d+-\d+)<\/td>/,
            away_recent_result: /<td>(胜|负|平)<\/td>/
        };

        // 提取单个值
        function extractSingleValue(htmlContent, regex) {
            console.log('🔍 extractSingleValue:', { regex: regex.toString() });
            try {
                const match = htmlContent.match(regex);
                const result = match ? match[1] || match[0] : '-';
                console.log('✅ 提取结果:', result);
                return result;
            } catch (error) {
                console.error('❌ 提取错误:', error);
                return '-';
            }
        }

        // 提取数组数据
        function extractArrayData(regexConfig, text, modulePrefix) {
            console.log(`🏆 开始提取 ${modulePrefix} 模块数据...`);
            const results = [];
            
            try {
                // 确定容器选择器
                let containerSelector = '';
                switch(modulePrefix) {
                    case 'home_recent':
                        containerSelector = 'home-recent-matches';
                        break;
                    case 'away_recent':
                        containerSelector = 'away-recent-matches';
                        break;
                    case 'future':
                        containerSelector = 'future-matches';
                        break;
                    case 'h2h':
                        containerSelector = 'h2h-matches';
                        break;
                }
                
                console.log(`📦 ${modulePrefix} 使用容器选择器: ${containerSelector}`);
                
                // 提取容器内容
                const containerRegex = new RegExp(`<div[^>]*id="${containerSelector}"[^>]*>([\\s\\S]*?)</div>`, 'g');
                const containerMatch = text.match(containerRegex);
                
                console.log(`🔍 ${modulePrefix} 容器匹配结果:`, containerMatch ? '找到' : '未找到');
                
                if (containerMatch && containerMatch[0]) {
                    const containerContent = containerMatch[0];
                    console.log(`📄 ${modulePrefix} 容器内容长度:`, containerContent.length);
                    
                    // 提取所有 tr 元素
                    const trRegex = /<tr[^>]*data-matchid="([^"]+)"[^>]*>[\\s\\S]*?<\\/tr>/g;
                    let trMatch;
                    let trCount = 0;
                    
                    while ((trMatch = trRegex.exec(containerContent)) !== null) {
                        trCount++;
                        const trContent = trMatch[0];
                        const matchData = {};
                        
                        console.log(`🎯 ${modulePrefix} 处理第 ${trCount} 个比赛记录, match_id: ${trMatch[1]}`);
                        
                        // 为每个字段提取数据
                        Object.keys(regexConfig).forEach(key => {
                            if (key.startsWith(modulePrefix + '_')) {
                                const fieldName = key.replace(modulePrefix + '_', '');
                                const regex = regexConfig[key];
                                
                                if (fieldName === 'match_id') {
                                    matchData[fieldName] = trMatch[1];
                                    console.log(`🆔 ${modulePrefix}_${fieldName}: ${matchData[fieldName]}`);
                                } else {
                                    const value = extractSingleValue(trContent, regex);
                                    matchData[fieldName] = value;
                                    console.log(`📊 ${modulePrefix}_${fieldName}: ${value}`);
                                }
                            }
                        });
                        
                        if (Object.keys(matchData).length > 0) {
                            results.push(matchData);
                            console.log(`✅ ${modulePrefix} 第 ${trCount} 个比赛记录已添加，字段数: ${Object.keys(matchData).length}`);
                        }
                    }
                    
                    console.log(`🏁 ${modulePrefix} 模块提取完成，共找到 ${trCount} 个比赛记录`);
                } else {
                    console.warn(`⚠️ ${modulePrefix} 未找到容器或容器为空`);
                }
                
                console.log(`📋 ${modulePrefix} 最终结果数组长度: ${results.length}`);
                return results;
                
            } catch (error) {
                console.error(`❌ ${modulePrefix} 提取过程中发生错误:`, error);
                return results;
            }
        }

        // 测试函数
        function testArrayModules() {
            console.log('🚀 开始数组模块专项测试...');
            
            const results = {};
            const modules = ['home_recent', 'away_recent'];
            
            modules.forEach(modulePrefix => {
                console.log(`\n🔍 测试模块: ${modulePrefix}`);
                const moduleData = extractArrayData(regexConfig, mockData, modulePrefix);
                results[modulePrefix] = moduleData;
                console.log(`📊 ${modulePrefix} 结果:`, moduleData);
            });
            
            // 显示结果
            displayResults(results);
            
            console.log('🎉 数组模块测试完成！');
        }

        function displayResults(results) {
            const resultsDiv = document.getElementById('results');
            let html = '<h3>📊 测试结果</h3>';
            
            Object.keys(results).forEach(module => {
                const data = results[module];
                const count = data.length;
                const className = count > 0 ? 'success' : 'error';
                
                html += `<div class="result ${className}">`;
                html += `<strong>${module}:</strong> 提取到 ${count} 条记录`;
                if (count > 0) {
                    html += '<ul>';
                    data.forEach((item, index) => {
                        html += `<li>记录 ${index + 1}: ${JSON.stringify(item)}</li>`;
                    });
                    html += '</ul>';
                }
                html += '</div>';
            });
            
            resultsDiv.innerHTML = html;
        }

        // 自动执行测试
        setTimeout(() => {
            console.log('🎯 自动执行数组模块测试...');
            testArrayModules();
        }, 1000);
    </script>
</body>
</html>
