<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终调试测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 10px; background: #007cba; color: white; border: none; cursor: pointer; }
        .results { margin-top: 20px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>🔧 最终调试测试</h1>
    
    <div class="test-section">
        <h2>测试步骤</h2>
        <button onclick="testFunctionExists()">1. 检查函数是否存在</button>
        <button onclick="testArrayModuleConfig()">2. 检查数组模块配置</button>
        <button onclick="testArrayExtraction()">3. 测试数组提取</button>
        <button onclick="runFullTest()">4. 运行完整测试</button>
    </div>
    
    <div class="results" id="results">
        测试结果将显示在这里...
    </div>

    <script>
        // 简化的测试数据
        const testData = `
            <div id="home-recent-matches">
                <table>
                    <tr><td>2024-01-15</td><td>荷兰</td><td>VS</td><td>德国</td><td>2-1</td></tr>
                    <tr><td>2024-01-10</td><td>荷兰</td><td>VS</td><td>法国</td><td>1-0</td></tr>
                </table>
            </div>
            <div id="h2h-matches">
                <table>
                    <tr><td>2023-12-20</td><td>荷兰</td><td>VS</td><td>Liverpool</td><td>3-2</td></tr>
                </table>
            </div>
        `;

        // 简化的配置
        const regexConfig = {
            arrayModules: {
                home_recent: {
                    date: { index: 0 },
                    home_team: { index: 1 },
                    vs: { index: 2 },
                    away_team: { index: 3 },
                    score: { index: 4 }
                },
                h2h: {
                    date: { index: 0 },
                    home_team: { index: 1 },
                    vs: { index: 2 },
                    away_team: { index: 3 },
                    score: { index: 4 }
                }
            }
        };

        // 数组提取函数
        function extractArrayData(moduleConfig, text, modulePrefix) {
            console.log(`🏆 开始提取 ${modulePrefix} 模块数据...`);
            
            if (!text || !moduleConfig) {
                console.error(`❌ ${modulePrefix} 参数验证失败`);
                return [];
            }

            // 根据模块前缀确定数据容器选择器
            let containerSelector = '';
            switch(modulePrefix) {
                case 'home_recent':
                    containerSelector = '#home-recent-matches table';
                    break;
                case 'h2h':
                    containerSelector = '#h2h-matches table';
                    break;
                default:
                    console.error(`❌ 未知的模块前缀: ${modulePrefix}`);
                    return [];
            }

            console.log(`🎯 ${modulePrefix} 容器选择器:`, containerSelector);

            // 解析HTML
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');
            
            // 查找容器
            const container = doc.querySelector(containerSelector);
            if (!container) {
                console.error(`❌ 未找到容器: ${containerSelector}`);
                return [];
            }

            // 查找所有行
            const rows = container.querySelectorAll('tr');
            console.log(`📊 ${modulePrefix} 找到 ${rows.length} 行数据`);

            const results = [];
            rows.forEach((row, rowIndex) => {
                const cells = row.querySelectorAll('td');
                console.log(`🔍 第 ${rowIndex + 1} 行有 ${cells.length} 个单元格`);
                
                const matchData = {};
                Object.keys(moduleConfig).forEach(fieldName => {
                    const fieldConfig = moduleConfig[fieldName];
                    const cellIndex = fieldConfig.index;
                    
                    if (cellIndex < cells.length) {
                        matchData[fieldName] = cells[cellIndex].textContent.trim();
                    } else {
                        matchData[fieldName] = '-';
                    }
                });
                
                results.push(matchData);
                console.log(`✅ 第 ${rowIndex + 1} 行数据:`, matchData);
            });

            return results;
        }

        function testFunctionExists() {
            const results = document.getElementById('results');
            results.innerHTML = `
                <h3>🔍 函数存在性检查</h3>
                <p>extractArrayData 类型: ${typeof extractArrayData}</p>
                <p>extractArrayData 是否为函数: ${typeof extractArrayData === 'function'}</p>
                <p>window.extractArrayData: ${typeof window.extractArrayData}</p>
            `;
        }

        function testArrayModuleConfig() {
            const results = document.getElementById('results');
            results.innerHTML = `
                <h3>📋 数组模块配置检查</h3>
                <p>regexConfig 存在: ${!!regexConfig}</p>
                <p>arrayModules 存在: ${!!regexConfig.arrayModules}</p>
                <p>arrayModules 类型: ${typeof regexConfig.arrayModules}</p>
                <p>模块数量: ${Object.keys(regexConfig.arrayModules).length}</p>
                <p>模块列表: ${Object.keys(regexConfig.arrayModules).join(', ')}</p>
                <pre>${JSON.stringify(regexConfig.arrayModules, null, 2)}</pre>
            `;
        }

        function testArrayExtraction() {
            console.log('🚀 开始测试数组提取...');
            const results = document.getElementById('results');
            
            try {
                const homeRecentData = extractArrayData(regexConfig.arrayModules.home_recent, testData, 'home_recent');
                const h2hData = extractArrayData(regexConfig.arrayModules.h2h, testData, 'h2h');
                
                results.innerHTML = `
                    <h3>🧪 数组提取测试结果</h3>
                    <h4>主队近期数据 (${homeRecentData.length} 条):</h4>
                    <pre>${JSON.stringify(homeRecentData, null, 2)}</pre>
                    <h4>交锋数据 (${h2hData.length} 条):</h4>
                    <pre>${JSON.stringify(h2hData, null, 2)}</pre>
                `;
            } catch (error) {
                results.innerHTML = `
                    <h3>❌ 测试失败</h3>
                    <p>错误: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }

        function runFullTest() {
            console.log('🎯 运行完整测试流程...');
            const results = document.getElementById('results');
            
            try {
                const extractedData = {};
                
                // 处理数组模块
                Object.keys(regexConfig.arrayModules).forEach(modulePrefix => {
                    console.log(`🚀 处理模块: ${modulePrefix}`);
                    const moduleConfig = regexConfig.arrayModules[modulePrefix];
                    const arrayData = extractArrayData(moduleConfig, testData, modulePrefix);
                    extractedData[modulePrefix] = arrayData;
                });
                
                results.innerHTML = `
                    <h3>🎉 完整测试结果</h3>
                    <pre>${JSON.stringify(extractedData, null, 2)}</pre>
                `;
                
            } catch (error) {
                results.innerHTML = `
                    <h3>❌ 完整测试失败</h3>
                    <p>错误: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
</body>
</html>
