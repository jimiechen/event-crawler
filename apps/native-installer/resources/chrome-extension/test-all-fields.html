        function extractSingleValue(htmlContent, regex) {
            try {
                console.log('🔍 extractSingleValue called with:', {
                    htmlContentLength: htmlContent ? htmlContent.length : 0,
                    regexType: typeof regex,
                    regexPattern: regex instanceof RegExp ? regex.source : regex
                });
                
                if (!regex || typeof regex.exec !== 'function') {
                    console.error('❌ Invalid regex object:', regex);
                    return "-";
                }
                
                if (!htmlContent || typeof htmlContent !== 'string') {
                    console.error('❌ Invalid HTML content:', typeof htmlContent);
                    return "-";
                }
                
                regex.lastIndex = 0;
                const match = regex.exec(htmlContent);
                const result = (match && match[1]) ? match[1].trim() : "-";
                
                console.log('✅ extractSingleValue result:', {
                    found: match ? true : false,
                    matchLength: match ? match.length : 0,
                    result: result
                });
                
                return result;
            } catch (error) {
                console.error('❌ Error in extractSingleValue:', error);
                return "-";
            }
        }

        // 提取数组数据的函数 - 用于处理多场比赛记录
        function extractArrayData(moduleConfig, text, modulePrefix) {
            console.log(`🏆 开始提取 ${modulePrefix} 模块数据...`);
            console.log(`📋 ${modulePrefix} 模块配置:`, moduleConfig);
            
            if (!text || !moduleConfig) {
                console.error(`❌ ${modulePrefix} 参数验证失败`);
                return [];
            }

            // 根据模块前缀确定数据容器选择器
            let containerSelector = '';
            switch(modulePrefix) {
                case 'home_recent':
                    containerSelector = '#home-recent-matches table, .home-recent-matches table';
                    break;
                case 'away_recent':
                    containerSelector = '#away-recent-matches table, .away-recent-matches table';
                    break;
                case 'future':
                    containerSelector = '#future-matches table, .future-matches table';
                    break;
                case 'h2h':
                    containerSelector = '#h2h-matches table, .h2h-matches table';
                    break;
            }
            
            console.log(`🎯 ${modulePrefix} 容器选择器:`, containerSelector);

            // 创建临时DOM来解析HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = text;
            
            // 查找容器
            const container = tempDiv.querySelector(containerSelector);
            if (!container) {
                console.error(`❌ ${modulePrefix} 未找到容器:`, containerSelector);
                return [];
            }

            console.log(`✅ ${modulePrefix} 找到容器，查找tr元素...`);
            const rows = container.querySelectorAll('tr');
            console.log(`📊 ${modulePrefix} 找到行数:`, rows.length);

            const results = [];
            rows.forEach((row, index) => {
                console.log(`🔍 ${modulePrefix} 处理第 ${index + 1} 行...`);
                const rowData = {};
                const cells = row.querySelectorAll('td');
                
                console.log(`📋 ${modulePrefix} 该行有 ${cells.length} 个单元格`);
                
                Object.keys(moduleConfig).forEach(fieldName => {
                    const fieldConfig = moduleConfig[fieldName];
                    const cellIndex = fieldConfig.index;
                    
                    if (cellIndex < cells.length) {
                        const cellContent = cells[cellIndex].textContent.trim();
                        rowData[fieldName] = cellContent;
                        console.log(`✅ ${modulePrefix}_${fieldName}: ${cellContent}`);
                    } else {
                        rowData[fieldName] = '-';
                        console.log(`❌ ${modulePrefix}_${fieldName}: 索引超出范围`);
                    }
                });
                
                results.push(rowData);
                console.log(`✅ ${modulePrefix} 第 ${index + 1} 行数据提取完成:`, rowData);
            });

            console.log(`🎉 ${modulePrefix} 数组数据提取完成，总计:`, results.length, '条记录');
            return results;
        }

            console.log('✅ 测试完成');
            
            // 显示结果到页面
            alert('数据结构测试完成！请查看浏览器控制台获取详细结果。');
        }

        function debugDataExtraction() {
            console.log('=== 开始调试数据提取 ===');
            
            // 测试两队交锋数据提取
            console.log('测试两队交锋数据提取...');
            const h2hData = extractArrayData(regexConfig, testData, 'h2h');
            console.log('两队交锋提取结果:', h2hData);
            console.log('两队交锋数据长度:', h2hData.length);
            
            // 测试未来比赛数据提取
            console.log('测试未来比赛数据提取...');
            const futureData = extractArrayData(regexConfig, testData, 'future');
            console.log('未来比赛提取结果:', futureData);
            console.log('未来比赛数据长度:', futureData.length);
            
            // 测试容器匹配
            console.log('测试容器匹配...');
            const h2hContainerRegex = new RegExp(`<div[^>]*id="h2h-matches"[^>]*>([\\s\\S]*?)</div>`, 'g');
            const h2hMatch = testData.match(h2hContainerRegex);
            console.log('两队交锋容器匹配结果:', h2hMatch ? '找到' : '未找到');
            if (h2hMatch) {
                console.log('两队交锋容器内容长度:', h2hMatch[0].length);
            }
            
            const futureContainerRegex = new RegExp(`<div[^>]*id="future-matches"[^>]*>([\\s\\S]*?)</div>`, 'g');
            const futureMatch = testData.match(futureContainerRegex);
            console.log('未来比赛容器匹配结果:', futureMatch ? '找到' : '未找到');
            if (futureMatch) {
                console.log('未来比赛容器内容长度:', futureMatch[0].length);
            }
            
            console.log('=== 调试完成 ===');
        }

        // 自定义HTML测试功能
        let isUsingCustomHtml = false;
        let originalTestData = null;

        function testCustomHtml() {
            const customHtml = document.getElementById('customHtmlInput').value.trim();
            if (!customHtml) {
                alert('请先输入HTML片段！');
                return;
            }

            // 保存原始测试数据
            if (!originalTestData) {
                originalTestData = testData;
            }

            // 使用自定义HTML替换testData
            window.testData = customHtml;
            isUsingCustomHtml = true;

            // 运行测试
            runCompleteTest();

            // 显示自定义测试结果
            document.getElementById('customTestResults').innerHTML = `
                <div style="background: #d4edda; border: 1px solid #c3e6cb; border-radius: 4px; padding: 10px; margin-top: 10px;">
                    <strong>✅ 自定义HTML测试完成</strong><br>
                    <small>测试结果已显示在下方各模块中。使用的是您输入的HTML数据。</small>
                </div>
            `;
        }

        function clearCustomTest() {
            document.getElementById('customHtmlInput').value = '';
            document.getElementById('customTestResults').innerHTML = '';
            
            // 如果正在使用自定义HTML，切换回预设数据
            if (isUsingCustomHtml) {
                switchToPresetData();
            }
        }

        function switchToPresetData() {
            if (originalTestData) {
                window.testData = originalTestData;
                isUsingCustomHtml = false;
                
                // 重新运行测试以显示预设数据的结果
                runCompleteTest();
                
                document.getElementById('customTestResults').innerHTML = `
                    <div style="background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px; padding: 10px; margin-top: 10px;">
                        <strong>🔄 已切换到预设数据</strong><br>
                        <small>现在使用的是内置的测试数据，测试结果已更新。</small>

                `;

            console.log('可用函数:', {

                showJsonOutput: typeof showJsonOutput,
                validateFormat: typeof validateFormat,
