### 回归测试配置

```yaml
regression_tests:
  # 回归测试套件
  suite: "regression"
  
  # 测试用例
  test_cases:
    - id: "REG-001"
      name: "应用启动回归测试"
      priority: "critical"
      description: "验证应用启动功能未受影响"
    - id: "REG-002"
      name: "浏览器自动化回归测试"
      priority: "high"
      description: "验证浏览器自动化功能未受影响"
    - id: "REG-003"
      name: "Chrome 扩展回归测试"
      priority: "high"
      description: "验证 Chrome 扩展功能未受影响"
    - id: "REG-004"
      name: "数据加载回归测试"
      priority: "medium"
      description: "验证数据加载功能未受影响"
  
  # 回归测试触发条件
  triggers:
    - type: "code_change"
      paths:
        - "src/launcher.py"
        - "src/browser_manager.py"
        - "src/extension_loader.py"
    - type: "dependency_update"
      packages:
        - "playwright"
        - "pyinstaller"
```

### 压力测试配置

```yaml
stress_tests:
  # 负载测试
  load:
    enabled: false
    tests:
      - name: "并发请求测试"
        concurrent_users: 100
        duration: 300  # 秒
      - name: "大数据量测试"
        data_size: "1GB"
      - name: "长时间运行测试"
        duration: 86400  # 24 小时
  
  # 内存泄漏测试
  memory_leak:
    enabled: false
    tests:
      - name: "浏览器实例泄漏"
        iterations: 100
        check_interval: 10  # 秒
      - name: "文件描述符泄漏"
        iterations: 1000
        check_interval: 1  # 秒
  
  # 资源限制测试
  resource_limits:
    enabled: false
    tests:
      - name: "低内存测试"
        memory_limit: "256MB"
      - name: "低磁盘空间测试"
        disk_limit: "100MB"
      - name: "网络限制测试"
        bandwidth_limit: "1Mbps"
```

