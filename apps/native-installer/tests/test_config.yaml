### 安全测试配置

```yaml
security_tests:
  # 权限测试
  permissions:
    enabled: true
    tests:
      - name: "文件访问权限"
        check_read_write: true
      - name: "网络访问权限"
        check_firewall: true
      - name: "进程权限"
        check_admin: false
  
  # 输入验证测试
  input_validation:
    enabled: true
    tests:
      - name: "SQL 注入"
        payloads:
          - "'; DROP TABLE users; --"
          - "' OR '1'='1"
      - name: "XSS 攻击"
        payloads:
          - "<script>alert('xss')</script>"
          - "<img src=x onerror=alert('xss')>"
      - name: "路径遍历"
        payloads:
          - "../../../etc/passwd"
          - "..\\..\\..\\..\\windows\\system32"
  
  # 认证测试
  authentication:
    enabled: true
    tests:
      - name: "弱密码"
        passwords:
          - "123456"
          - "password"
          - "admin"
      - name: "暴力破解防护"
        max_attempts: 5
        lockout_duration: 300  # 秒
```

