# 测试配置文件

## 测试环境配置

### 通用配置

```yaml
test_environment:
  os_type: "Darwin"  # Windows, Darwin, Linux
  python_version: "3.11.0"
  test_timeout: 300  # 测试超时时间（秒）
  
  # 项目路径
  project_root: "/Users/mac/StudioProjects/open-citycloud/projects/event-crawler/apps/native-installer"
  
  # 测试输出
  output_dir: "test_results"
  log_dir: "test_logs"
  
  # 测试覆盖
  coverage_enabled: true
  coverage_threshold: 80  # 代码覆盖率阈值（%）
```

### 单元测试配置

```yaml
unit_tests:
  enabled: true
  test_files:
    - "tests/test_installer.py"
  
  # 测试框架
  framework: "pytest"
  options:
    - "-v"
    - "--tb=short"
    - "--cov=src"
    - "--cov-report=html"
    - "--cov-report=term"
  
  # 测试分组
  groups:
    - name: "launcher"
      pattern: "TestLauncher"
    - name: "browser_manager"
      pattern: "TestBrowserManager"
    - name: "extension_loader"
      pattern: "TestExtensionLoader"
    - name: "build_manager"
      pattern: "TestBuildManager"
```

### 验收测试配置

```yaml
acceptance_tests:
  enabled: true
  test_file: "tests/acceptance_test_installer.py"
  
  # 测试阶段
  phases:
    - name: "项目结构测试"
      priority: 1
      required: true
    - name: "源代码语法测试"
      priority: 2
      required: true
    - name: "配置文件测试"
      priority: 3
      required: true
    - name: "文档完整性测试"
      priority: 4
      required: true
    - name: "跨平台兼容性测试"
      priority: 5
      required: true
    - name: "依赖完整性测试"
      priority: 6
      required: true
    - name: "构建准备测试"
      priority: 7
      required: true
  
  # 测试标准
  criteria:
    all_required: true  # 所有必需测试必须通过
    min_pass_rate: 0.95  # 最小通过率 95%
    allow_warnings: true  # 允许警告但不阻塞
```

### 平台测试配置

```yaml
platform_tests:
  # macOS 测试
  macos:
    enabled: true
    vm_required: false  # 是否需要虚拟机
    
    # 测试项目
    test_items:
      - name: "应用包生成"
        command: "python scripts/build.py"
        expected_output: "dist/StockMonitor.app"
      - name: "DMG 生成"
        command: "python scripts/setup_macos.py"
        expected_output: "build/macos/StockMonitor.dmg"
      - name: "应用安装"
        command: "cp -R dist/StockMonitor.app /Applications/"
        expected_output: "/Applications/StockMonitor.app"
      - name: "应用启动"
        command: "open /Applications/StockMonitor.app"
        expected_output: "running process"
      - name: "Web 服务访问"
        url: "http://localhost:8000"
        expected_status: 200
      - name: "Chrome 扩展加载"
        check: "chrome://extensions/"
        expected_extension: "StockMonitor Extension"
      - name: "应用卸载"
        command: "~/Library/Application\\ Support/StockMonitor/uninstall.sh"
        expected_output: "removed"
  
  # Windows 测试
  windows:
    enabled: false  # 当前环境为 macOS，暂不启用
    vm_required: true
    
    # 测试项目
    test_items:
      - name: "可执行文件生成"
        command: "python scripts/build.py"
        expected_output: "dist/StockMonitor/StockMonitor.exe"
      - name: "安装程序生成"
        command: "python scripts/setup_windows.py"
        expected_output: "build/windows/StockMonitor-Setup.exe"
      - name: "应用安装"
        command: "StockMonitor-Setup.exe"
        expected_output: "C:\\Program Files\\StockMonitor"
      - name: "应用启动"
        command: "StockMonitor.exe"
        expected_output: "running process"
      - name: "Web 服务访问"
        url: "http://localhost:8000"
        expected_status: 200
      - name: "Chrome 扩展加载"
        check: "chrome://extensions/"
        expected_extension: "StockMonitor Extension"
      - name: "应用卸载"
        command: "uninstall.exe"
        expected_output: "removed"
```

### 功能测试配置

```yaml
functional_tests:
  # 应用启动测试
  startup:
    enabled: true
    tests:
      - name: "启动时间"
        threshold: 15  # 最大启动时间（秒）
      - name: "启动日志"
        check_errors: false
      - name: "进程检查"
        check_running: true
  
  # Web 服务测试
  web_service:
    enabled: true
    base_url: "http://localhost:8000"
    tests:
      - name: "健康检查 API"
        endpoint: "/api/v1/health"
        method: "GET"
        expected_status: 200
      - name: "API 文档访问"
        endpoint: "/docs"
        method: "GET"
        expected_status: 200
      - name: "ReDoc 文档访问"
        endpoint: "/redoc"
        method: "GET"
        expected_status: 200
      - name: "静态文件访问"
        endpoint: "/static/js/navbar.js"
        method: "GET"
        expected_status: 200
  
  # 浏览器自动化测试
  browser_automation:
    enabled: true
    tests:
      - name: "浏览器启动"
        headless: true
      - name: "页面导航"
        url: "https://example.com"
        timeout: 30
      - name: "页面截图"
        save_path: "test_screenshot.png"
      - name: "JavaScript 执行"
        script: "document.title"
      - name: "元素点击"
        selector: "button"
      - name: "表单填充"
        selector: "input"
        value: "test"
      - name: "Cookie 管理"
        action: "get_cookies"
  
  # Chrome 扩展测试
  chrome_extension:
    enabled: true
    tests:
      - name: "扩展加载"
        check_manifest: true
      - name: "扩展权限"
        required_permissions:
          - "nativeMessaging"
          - "tabs"
          - "activeTab"
      - name: "扩展功能"
        test_features:
          - "background script"
          - "content script"
          - "popup"
      - name: "扩展通信"
        test_native_messaging: true
```

### 性能测试配置

```yaml
performance_tests:
  # 启动性能测试
  startup:
    enabled: true
    tests:
      - name: "冷启动时间"
        iterations: 3
        threshold: 15  # 秒
      - name: "热启动时间"
        iterations: 3
        threshold: 5  # 秒
      - name: "内存占用"
        threshold: 500  # MB
      - name: "CPU 占用"
        threshold: 30  # %
  
  # 运行性能测试
  runtime:
    enabled: true
    duration: 300  # 测试持续时间（秒）
    tests:
      - name: "CPU 占用率"
        threshold: 30  # %
        interval: 10  # 采样间隔（秒）
      - name: "内存占用率"
        threshold: 1024  # MB
        interval: 10
      - name: "响应时间"
        endpoint: "/api/v1/health"
        threshold: 1000  # 毫秒
        interval: 10
  
  # 资源使用测试
  resource:
    enabled: true
    tests:
      - name: "磁盘 I/O"
        threshold: 100  # MB/s
      - name: "网络 I/O"
        threshold: 10  # MB/s
      - name: "文件描述符"
        threshold: 1024  # 数量
```

### 集成测试配置

```yaml
integration_tests:
  # 完整构建流程测试
  build_flow:
    enabled: true
    steps:
      - name: "清理构建目录"
        command: "python scripts/build.py --clean"
      - name: "准备资源文件"
        command: "python scripts/build.py --prepare"
      - name: "安装依赖"
        command: "python scripts/build.py --install-deps"
      - name: "安装浏览器"
        command: "python scripts/build.py --install-browsers"
      - name: "执行打包"
        command: "python scripts/build.py --build"
      - name: "生成安装程序"
        command: "python scripts/build.py --installer"
  
  # 资源集成测试
  resource_integration:
    enabled: true
    tests:
      - name: "Chrome 扩展集成"
        source: "../chrome-extension"
        target: "resources/chrome-extension"
      - name: "CSV 数据集成"
        source: "/Volumes/MacintoshHD/data/daily"
        target: "resources/csv-data"
        sample_size: 10  # 复制样本数量
      - name: "配置文件集成"
        source: "../stock-monitor-backend/config"
        target: "resources/configs"
      - name: "静态文件集成"
        source: "../stock-monitor-backend/static"
        target: "resources/static"
```

