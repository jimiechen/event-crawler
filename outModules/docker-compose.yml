version: '3.8'

services:
  oasis-service:
    build:
      context: .
      dockerfile: open-citycloud/modules/oasis-simulation-server/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - GRPC_PORT=50051
    volumes:
      - ./open-citycloud/modules/oasis-simulation-server/.env:/app/service/.env
    networks:
      - mineplanet-net

  ai-gateway:
    build:
      context: .
      dockerfile: MineplanetGo/mineplanet/AiGateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      # In docker network, service name is host
      - OASIS_SERVICE_URL=http://oasis-service:50051
    depends_on:
      - oasis-service
    networks:
      - mineplanet-net

networks:
  mineplanet-net:
    driver: bridge
