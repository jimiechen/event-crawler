# Redis 7 配置文件

# 网络设置
bind 0.0.0.0
port 6379
protected-mode no

# 持久化设置
save 900 1
save 300 10
save 60 10000

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存设置
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志设置
loglevel notice
logfile ""

# 数据库设置
databases 16

# 超时设置
timeout 300
tcp-keepalive 300

# 客户端设置
tcp-backlog 511
maxclients 10000

# 安全设置（可选，如果需要密码认证）
# requirepass your_redis_password

# 性能优化
hz 10
dynamic-hz yes

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 延迟监控
latency-monitor-threshold 100