<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票日线图</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="/static/js/navbar.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; display: flex; flex-direction: column; height: 100vh; }
        .main-container { display: flex; width: 100%; gap: 20px; flex: 1; }
        .left-sidebar { width: 20%; min-width: 200px; }
        .right-content { width: 80%; flex-grow: 1; }
        #chart-container { width: 100%; height: 600px; border: 1px solid #ccc; }
        .controls { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .controls input { padding: 6px; }
        .controls button { padding: 6px 12px; }
        .favorites-container { padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; height: 100%; overflow-y: auto; }
        .favorites-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .favorite-item { padding: 8px 12px; background: #eef; border-radius: 4px; cursor: pointer; position: relative; border-left: 3px solid #66b; }
        .favorite-remove { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #f44; color: #fff; font-size: 12px; display: none; align-items: center; justify-content: center; }
        .favorite-item:hover .favorite-remove { display: flex; }
        .log-section { margin-top: 20px; padding: 10px; border-top: 1px solid #ddd; }
        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th, .log-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .log-table th { background: #f2f2f2; }
        #loading { display: none; color: #00f; }
        #error { display: none; color: #f00; }
        /* Custom Stock Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 400px; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: black; text-decoration: none; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .form-group .hint { font-size: 12px; color: #666; margin-top: 4px; }
        .btn-submit { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-submit:hover { background-color: #45a049; }
        .btn-submit:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
<script src="/static/js/custom-alert.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="left-sidebar">
            <div class="favorites-container">
                <div class="favorites-title">
                    <span>股票列表</span>
                    <div>
                        <button id="add-custom-btn" style="background-color: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px;">+ 添加自定义</button>
                        <button id="sync-wencai">同步问财</button>
                        <button id="refresh-left">刷新</button>
                    </div>
                </div>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <button class="left-tab active" data-target="left-ths">同花顺自选股</button>
                    <button class="left-tab" data-target="left-wencai">问财股票列表</button>
                </div>
                <div id="left-ths" class="favorites-list"></div>
                <div id="left-wencai" class="favorites-list" style="display:none;"></div>
            </div>
        </div>
        <div class="right-content">
            <div class="controls">
                <label>股票代码</label>
                <input id="stock-code" value="600101.SH" placeholder="600101.SH 或 SZ000001" />
                <label>开始</label>
                <input type="date" id="start-date-input" />
                <label>结束</label>
                <input type="date" id="end-date-input" />
                <label>天数</label>
                <input type="number" id="days-count" value="120" min="1" max="1000" />
                <button id="prev-day-button">-</button>
                <button id="next-day-button">+</nbutton>
                <button id="fetch-button">获取数据</button>
                <button id="add-favorite-button">添加到自选</button>
                <span id="loading">正在加载数据...</span>
                <div id="error"></div>
            </div>
            <div id="chart-container"></div>
            <div class="log-section">
                <div style="margin-bottom:8px;display:flex;gap:8px;align-items:center;">
                    <button id="analyze-rules">规则分析</button>
                    <button id="analyze-morph">形态分析</button>
                    <button id="clear-logs">清空日志</button>
                </div>
                <div style="display:flex;gap:8px;margin-bottom:8px;">
                    <button class="tab" data-target="tab-all">所有记录</button>
                    <button class="tab" data-target="tab-high">高量记录</button>
                    <button class="tab" data-target="tab-morph">形态分析</button>
                    <button class="tab" data-target="tab-three">三日形态</button>
                    <button class="tab" data-target="tab-rules">规则匹配</button>
                </div>
                <div id="tab-all" class="tab-content">
                    <table class="log-table"><thead><tr><th>日期</th><th>类型/规则</th><th>量价状态</th><th>操作提示</th><th>详情</th></tr></thead><tbody id="log-all"></tbody></table>
                </div>
                <div id="tab-high" class="tab-content" style="display:none;">
                    <table class="log-table"><thead><tr><th>日期</th><th>量价状态</th><th>操作提示</th><th>详情</th></tr></thead><tbody id="log-high"></tbody></table>
                </div>
                <div id="tab-morph" class="tab-content" style="display:none;">
                    <table class="log-table"><thead><tr><th>日期</th><th>成交量状态</th><th>价格状态</th><th>涨幅(%)</th><th>实体(%)</th><th>上影(%)</th><th>下影(%)</th><th>位置</th></tr></thead><tbody id="log-morph"></tbody></table>
                </div>
                <div id="tab-three" class="tab-content" style="display:none;">
                    <table class="log-table"><thead><tr><th>日期</th><th>三日形态描述</th></tr></thead><tbody id="log-three"></tbody></table>
                </div>
                <div id="tab-rules" class="tab-content" style="display:none;">
                    <table class="log-table"><thead><tr><th>日期</th><th>规则</th><th>提示</th><th>详情</th></tr></thead><tbody id="log-rules"></tbody></table>
                </div>
            </div>
        </div>
    </div>
    <!-- Add Custom Stock Modal -->
    <div id="add-custom-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>添加自定义股票</h3>
            <div class="form-group">
                <label>股票代码</label>
                <input type="text" id="custom-code" placeholder="如: 600000.SH, 000001.SZ">
                <div class="hint">支持批量添加，使用逗号分隔多个代码</div>
            </div>
            <div class="form-group">
                <label>自定义标签/名称</label>
                <input type="text" id="custom-label" placeholder="如: 龙头股">
                <div class="hint">批量添加时将统一使用此标签</div>
            </div>
            <div class="form-group">
                <label>自定义时间 (可选)</label>
                <input type="date" id="custom-date">
                <div class="hint">用于临时高亮显示或记录</div>
            </div>
            <button id="submit-custom" class="btn-submit">提交</button>
        </div>
    </div>

    <script>
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom);
        const API_BASE = '';

        const option = {
            tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
            legend: { data: ['日K','成交量','5日均量','60日均量'] },
            grid: [{ left:'10%', right:'8%', height:'50%' },{ left:'10%', right:'8%', top:'65%', height:'10%' }],
            xAxis: [{ type:'category', data:[], boundaryGap:false, axisLine:{ onZero:false }, splitLine:{ show:false }, axisLabel:{ show:false } }, { type:'category', gridIndex:1, data:[], boundaryGap:false, axisLine:{ onZero:false }, axisTick:{ show:false }, splitLine:{ show:false }, axisLabel:{ show:false } }],
            yAxis: [{ scale:true }, { gridIndex:1, scale:true }],
            dataZoom: [{ type:'inside', xAxisIndex:[0,1], start:0, end:100 }, { show:true, xAxisIndex:[0,1], type:'slider', top:'94%', start:0, end:100 }],
            series: [
                { name:'日K', type:'candlestick', data:[], itemStyle:{ color:'#ec0000', color0:'#00da3c', borderColor:'#ec0000', borderColor0:'#00da3c' } },
                { name:'成交量', type:'bar', xAxisIndex:1, yAxisIndex:1, data:[], itemStyle:{ color:(p)=>{ const v=p.value; const s=v&&Array.isArray(v)&&v.length>2?v[2]:0; if(s===1) return '#ec0000'; if(s===-1) return '#00da3c'; return '#ccc'; } } },
                { name:'5日均量', type:'line', xAxisIndex:1, yAxisIndex:1, data:[], symbol:'none', lineStyle:{ color:'#00f', width:1 } },
                { name:'60日均量', type:'line', xAxisIndex:1, yAxisIndex:1, data:[], symbol:'none', lineStyle:{ color:'#f00', width:1 } }
            ]
        };

        async function fetchDaily(code, days, startDate, endDate){
            const url = `${API_BASE}/api/stock/daily/${encodeURIComponent(code)}?days=${days||''}&start_date=${startDate||''}&end_date=${endDate||''}`;
            const r = await fetch(url);
            const j = await r.json();
            if(!j.success) throw new Error(j.message||'请求失败');
            return j.data||[];
        }
        async function fetchLogs(code, startDate, endDate){
            const url = `${API_BASE}/api/trading-rules/logs/${encodeURIComponent(code)}?start_date=${startDate||''}&end_date=${endDate||''}`;
            const r = await fetch(url);
            const j = await r.json();
            return (j && j.logs) ? j.logs : [];
        }
        async function clearLogs(code, startDate, endDate){
            const url = `${API_BASE}/api/trading-rules/logs/${encodeURIComponent(code)}?start_date=${startDate||''}&end_date=${endDate||''}`;
            const r = await fetch(url,{ method:'DELETE' });
            const j = await r.json();
            return j && j.code === 0;
        }
        async function analyzeRules(code, days){
            const url = `${API_BASE}/api/trading-rules/analyze/${encodeURIComponent(code)}?days=${days||120}`;
            const r = await fetch(url,{ method:'POST' });
            const j = await r.json();
            return j && j.code === 0;
        }
        async function analyzeMorph(code, days){
            const url = `${API_BASE}/api/morphology/analyze/${encodeURIComponent(code)}?days=${days||120}`;
            const r = await fetch(url,{ method:'POST' });
            const j = await r.json();
            return j && j.code === 0;
        }
        async function listMonitors(){
            const url = `${API_BASE}/api/v1/monitors?active_only=true&limit=1000000&offset=0&include_latest_data=true`;
            console.log('[listMonitors] GET', url);
            try {
                const r = await fetch(url);
                console.log('[listMonitors] status', r.status);
                const j = await r.json();
                console.log('[listMonitors] json', j);
                const items = j && j.data && j.data.items ? j.data.items : [];
                return items.map(it=>({
                    code: it.stock_code||it.code,
                    name: (it.stock_info && it.stock_info.stock_name) || '',
                    price: (it.latest_data && it.latest_data.price) || '',
                    add_date: (it.created_at||'').toString().split('T')[0]
                }));
            } catch (e) {
                console.error('[listMonitors] error', e);
                return [];
            }
        }
        async function listWencaiLatest(){
            const url = `${API_BASE}/api/v1/wencai/stocks/latest?limit=1000000`;
            console.log('[listWencaiLatest] GET', url);
            try {
                const r = await fetch(url);
                console.log('[listWencaiLatest] status', r.status);
                const j = await r.json();
                console.log('[listWencaiLatest] json', j);
                let items = j && j.data ? j.data : [];
                
                const mapItem = (it) => ({
                    id: it.id,
                    code: it.stock_code || it.code || it.symbol || '',
                    name: it.stock_name || it.name || '',
                    price: it.current_price || it.price || '',
                    add_date: (it.created_at || '').toString().split('T')[0]
                });

                let codes = items.map(mapItem);
                
                const seen = new Set();
                const dedup = [];
                codes.forEach(x=>{ const c=x.code; if(c && !seen.has(c)){ seen.add(c); dedup.push(x); } });
                
                if (dedup.length === 0) {
                    console.warn('[listWencaiLatest] empty, try latest batch');
                    // 获取最新批次并读其stocks
                    const rb = await fetch(`${API_BASE}/api/v1/wencai/batches?limit=1`);
                    const jb = await rb.json();
                    console.log('[listWencaiLatest] batches json', jb);
                    const bid = jb && jb.data && jb.data.length>0 ? (jb.data[0].id || jb.data[0].batch_id) : null;
                    if (bid) {
                        const rs = await fetch(`${API_BASE}/api/v1/wencai/stocks?batch_id=${bid}&limit=1000000`);
                        const js = await rs.json();
                        console.log('[listWencaiLatest] batch stocks json', js);
                        items = js && js.data ? js.data : [];
                        const cs = items.map(mapItem);
                        const seen2 = new Set(); const dedup2=[];
                        cs.forEach(x=>{ const c=x.code; if(c && !seen2.has(c)){ seen2.add(c); dedup2.push(x); } });
                        if (dedup2.length>0) return dedup2;
                    }
                    console.warn('[listWencaiLatest] still empty, using fallback');
                    return [ { code: '600036', name:'招商银行', price:'-', add_date: '' }, { code: '600519', name:'贵州茅台', price:'-', add_date: '' }, { code: '000858', name:'五粮液', price:'-', add_date: '' }, { code: '000001', name:'平安银行', price:'-', add_date: '' }, { code: '000002', name:'万科A', price:'-', add_date: '' } ];
                }
                return dedup;
            } catch (e) {
                console.error('[listWencaiLatest] error', e);
                return [
                    { code: '600000.SH', name:'浦发银行', price:'-', add_date: '' },
                    { code: '600519.SH', name:'贵州茅台', price:'-', add_date: '' },
                    { code: '000001.SZ', name:'平安银行', price:'-', add_date: '' }
                ];
            }
        }
        async function addMonitor(code){
            const url = `${API_BASE}/api/v1/monitors`;
            const r = await fetch(url,{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ stock_code: code, priority:1, auto_create_stock:true }) });
            return r.ok;
        }
        async function removeMonitor(code){
            const url = `${API_BASE}/api/v1/monitors/${encodeURIComponent(code)}`;
            const r = await fetch(url,{ method:'DELETE' });
            return r.ok;
        }
        async function removeWencaiStock(code){
            if(!confirm('确认从问财列表中删除股票 '+code+' 吗？')) return false;
            const url = `${API_BASE}/api/v1/wencai/stocks/${encodeURIComponent(code)}`;
            const r = await fetch(url,{ method:'DELETE' });
            return r.ok;
        }
        async function syncFromWencai(){
            const url = `${API_BASE}/api/v1/favorites/sync-from-wencai`;
            const r = await fetch(url,{ method:'POST' });
            return r.ok;
        }
        function processData(data){
            const dates=[], k=[], vol=[], volVals=[];
            for(let i=0;i<data.length;i++){
                const d=data[i];
                dates.push(d.trade_date||'');
                const o=+d.open, c=+d.close, l=+d.low, h=+d.high, v=+d.volume;
                k.push([o,c,l,h]);
                const sign = o<c?1:(o>c?-1:0);
                vol.push([i, isNaN(v)?0:v, sign]);
                volVals.push(isNaN(v)?0:v);
            }
            const ma5=[], ma60=[];
            for(let i=0;i<volVals.length;i++){
                if(i>=4){ ma5.push([i, volVals.slice(i-4,i+1).reduce((a,b)=>a+b,0)/5]); } else { ma5.push([i,null]); }
                if(i>=59){ ma60.push([i, volVals.slice(i-59,i+1).reduce((a,b)=>a+b,0)/60]); } else { ma60.push([i,null]); }
            }
            return { dates, k, vol, ma5, ma60 };
        }
        function render(series, customDate){
            let markLineData = [];
            let customDateIndex = -1;

            if (customDate && series.dates) {
                customDateIndex = series.dates.indexOf(customDate);
                if (customDateIndex !== -1) {
                    const kData = series.k[customDateIndex]; // [open, close, low, high]
                    if (kData) {
                        markLineData = [
                            { yAxis: kData[0], lineStyle: { color: 'blue', type: 'dashed', width: 2 }, label: { formatter: 'Open: {c}', position: 'start' } },
                            { yAxis: kData[1], lineStyle: { color: 'orange', type: 'dashed', width: 2 }, label: { formatter: 'Close: {c}', position: 'start' } }
                        ];
                    }
                }
            }

            const volSeries = {
                ...option.series[1],
                data: series.vol,
                itemStyle: {
                    color: (p) => {
                        if (customDateIndex !== -1 && p.dataIndex === customDateIndex) {
                            return '#FFD700'; // Gold color for highlight
                        }
                        const v = p.value;
                        const s = v && Array.isArray(v) && v.length > 2 ? v[2] : 0;
                        if (s === 1) return '#ec0000';
                        if (s === -1) return '#00da3c';
                        return '#ccc';
                    }
                }
            };

            const kSeries = {
                ...option.series[0],
                data: series.k,
                markLine: {
                    data: markLineData,
                    symbol: ['none', 'none'],
                    silent: true
                }
            };

            myChart.setOption({
                ...option,
                xAxis:[{...option.xAxis[0], data: series.dates},{...option.xAxis[1], data: series.dates}],
                series:[
                    kSeries,
                    volSeries,
                    { ...option.series[2], data: series.ma5 },
                    { ...option.series[3], data: series.ma60 }
                ]
            }, true);
        }
        function renderLogs(logs){
            const all=document.getElementById('log-all'); const high=document.getElementById('log-high'); const morph=document.getElementById('log-morph'); const three=document.getElementById('log-three'); const rules=document.getElementById('log-rules');
            all.innerHTML=''; high.innerHTML=''; morph.innerHTML=''; three.innerHTML=''; rules.innerHTML='';
            logs.forEach(e=>{
                const det=e.details||{};
                const trA=document.createElement('tr');
                const typeRule=(e.log_type==='rule_match'&&e.rule_number)?`规则 ${e.rule_number}:${e.rule_content}`:e.log_type;
                trA.innerHTML=`<td>${e.trade_date||'-'}</td><td>${typeRule||'-'}</td><td>${det.volume_status||e.price_status||'-'}</td><td>${e.vp_action_hint||'-'}</td><td>${Object.entries(det).map(([k,v])=>`${k}:${typeof v==='number'?v.toFixed(2):v}`).join('; ')}</td>`;
                all.appendChild(trA);
                if(e.log_type==='volume_price_analysis'){ const tr=document.createElement('tr'); tr.innerHTML=`<td>${e.trade_date||'-'}</td><td>${det.volume_status||'-'}</td><td>${e.vp_action_hint||'-'}</td><td>${Object.entries(det).map(([k,v])=>`${k}:${typeof v==='number'?v.toFixed(2):v}`).join('; ')}</td>`; high.appendChild(tr); }
                if(e.log_type==='morphology_analysis'){ const tr=document.createElement('tr'); tr.innerHTML=`<td>${e.trade_date||'-'}</td><td>${det.volume_status||'-'}</td><td>${det.price_status||'-'}</td><td>${fmt(det.price_change_pct)}</td><td>${fmt(det.body_pct)}</td><td>${fmt(det.upper_shadow_pct)}</td><td>${fmt(det.lower_shadow_pct)}</td><td>${det.position_label||'-'}</td>`; morph.appendChild(tr); }
                if(e.log_type==='three_day_pattern'){ const tr=document.createElement('tr'); tr.innerHTML=`<td>${e.trade_date||'-'}</td><td>${det.description||det.pattern_name||'-'}</td>`; three.appendChild(tr); }
                if(e.log_type==='rule_match'){ const tr=document.createElement('tr'); tr.innerHTML=`<td>${e.trade_date||'-'}</td><td>${e.rule_number?`规则 ${e.rule_number}:${e.rule_content}`:'-'}</td><td>${e.vp_action_hint||'-'}</td><td>${Object.entries(det).map(([k,v])=>`${k}:${typeof v==='number'?v.toFixed(2):v}`).join('; ')}</td>`; rules.appendChild(tr); }
            });
        }
        function fmt(v){ return (v===null||v===undefined)?'-':(typeof v==='number'?v.toFixed(2):v); }
        async function renderThsList(){
            const items = await listMonitors();
            const seen = new Set(); const dedup = [];
            items.forEach(x=>{ if(x.code && !seen.has(x.code)){ seen.add(x.code); dedup.push(x); } });
            const list = document.getElementById('left-ths');
            console.log('[renderThsList] items', items.length, 'dedup', dedup.length);
            list.innerHTML='';
            if (dedup.length === 0) {
                list.innerHTML = '<div>暂无自选数据（可点击同步问财或添加监控）</div>';
                return;
            }
            dedup.forEach(it=>{
                const div=document.createElement('div');
                div.className='favorite-item';
                div.innerHTML=`
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                            <span class="favorite-name" style="font-weight:bold; font-size:14px;">${it.name || it.code}</span>
                            <span class="favorite-price" style="font-weight:bold; color:${it.price>0?'#e00':'#000'}">${it.price || '--'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between;">
                            <span class="favorite-code" style="color:#666; font-size:12px;">${it.code}</span>
                            <span class="favorite-date" style="color:#999; font-size:10px;">${it.add_date}</span>
                        </div>
                    </div>
                    <span class="favorite-remove" data-code="${it.code}" style="margin-left:8px;">×</span>
                `;
                div.addEventListener('click',(ev)=>{
                    if(ev.target.classList.contains('favorite-remove')) return;
                    document.getElementById('stock-code').value=it.code;
                    load();
                });
                const rm = div.querySelector('.favorite-remove');
                if (rm) rm.addEventListener('click',(ev)=>{ ev.stopPropagation(); removeMonitor(it.code).then(renderThsList); });
                list.appendChild(div);
            });
        }
        async function moveToStockInfo(wencaiId) {
            if(!confirm('确认将此股票移动到股票信息表吗？')) return;
            try {
                const url = `${API_BASE}/api/v1/stocks/wencai/${wencaiId}/move-to-stock-info`;
                const r = await fetch(url, { method: 'POST' });
                const j = await r.json();
                if (j.success) {
                    alert('移动成功');
                    renderThsList(); // Refresh main list
                } else {
                    alert('移动失败: ' + j.message);
                }
            } catch (e) {
                console.error('Failed to move stock:', e);
                alert('移动失败');
            }
        }
        async function renderWencaiList(){
            const items = await listWencaiLatest();
            const list = document.getElementById('left-wencai');
            console.log('[renderWencaiList] items', items.length);
            list.innerHTML='';
            if (items.length === 0) {
                list.innerHTML = '<div>暂无问财数据（请先解析问财或同步）</div>';
                return;
            }
            items.forEach(it=>{
                const div=document.createElement('div');
                div.className='favorite-item';
                div.innerHTML=`
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                            <span class="favorite-name" style="font-weight:bold; font-size:14px;">${it.name || it.code}</span>
                            <span class="favorite-price" style="font-weight:bold; color:${it.price>0?'#e00':'#000'}">${it.price || '--'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between;">
                            <span class="favorite-code" style="color:#666; font-size:12px;">${it.code}</span>
                            <span class="favorite-date" style="color:#999; font-size:10px;">${it.add_date}</span>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; justify-content:space-between; margin-left:8px; height:100%;">
                        <span class="favorite-remove" data-code="${it.code}" title="删除">×</span>
                        ${it.id ? `<span class="favorite-move" data-id="${it.id}" title="移动到股票表" style="cursor:pointer; color:green; font-weight:bold;">+</span>` : ''}
                    </div>
                `;
                div.addEventListener('click',(ev)=>{
                    if(ev.target.classList.contains('favorite-remove') || ev.target.classList.contains('favorite-move')) return;
                    document.getElementById('stock-code').value=it.code; 
                    load(); 
                });
                const rm = div.querySelector('.favorite-remove');
                if (rm) rm.addEventListener('click',(ev)=>{ ev.stopPropagation(); removeWencaiStock(it.code).then(renderWencaiList); });
                
                const mv = div.querySelector('.favorite-move');
                if (mv) mv.addEventListener('click', (ev) => { ev.stopPropagation(); moveToStockInfo(it.id); });
                
                list.appendChild(div);
            });
        }
        async function load(customDate=null){
            const code=document.getElementById('stock-code').value.trim();
            const days=parseInt(document.getElementById('days-count').value,10)||120;
            let start=document.getElementById('start-date-input').value; let end=document.getElementById('end-date-input').value;
            if(!start||!end){ const today=new Date(); end=today.toISOString().split('T')[0]; const s=new Date(today); s.setDate(today.getDate()-(days-1)); start=s.toISOString().split('T')[0]; document.getElementById('start-date-input').value=start; document.getElementById('end-date-input').value=end; }
            document.getElementById('loading').style.display='inline'; document.getElementById('error').style.display='none';
            try{
                const daily=await fetchDaily(code,days,start,end);
                const s=processData(daily);
                render({ dates:s.dates, k:s.k, vol:s.vol, ma5:s.ma5, ma60:s.ma60 }, customDate);
                const logs=await fetchLogs(code,start,end);
                renderLogs(logs);
            }catch(e){ document.getElementById('error').textContent=e.message; document.getElementById('error').style.display='block'; }
            finally{ document.getElementById('loading').style.display='none'; }
        }
        document.getElementById('fetch-button').addEventListener('click', ()=>load());
        document.getElementById('add-favorite-button').addEventListener('click', ()=>{ const c=document.getElementById('stock-code').value.trim(); if(c) addMonitor(c).then(refreshFavorites); });
        document.getElementById('refresh-left').addEventListener('click', ()=>{ const active = document.querySelector('.left-tab.active')?.getAttribute('data-target'); console.log('[refresh-left] active', active); if(active==='left-ths'){ renderThsList(); } else { renderWencaiList(); } });
        document.getElementById('sync-wencai').addEventListener('click', ()=>{ syncFromWencai().then(refreshFavorites); });
        document.querySelectorAll('.left-tab').forEach(btn=>{
            btn.addEventListener('click',()=>{
                document.querySelectorAll('.left-tab').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-target');
                document.getElementById('left-ths').style.display = target==='left-ths' ? 'block' : 'none';
                document.getElementById('left-wencai').style.display = target==='left-wencai' ? 'block' : 'none';
                if(target==='left-ths') renderThsList(); else renderWencaiList();
            });
        });
        document.getElementById('analyze-rules').addEventListener('click', async ()=>{ const c=document.getElementById('stock-code').value.trim(); const d=parseInt(document.getElementById('days-count').value,10)||120; await analyzeRules(c,d); const start=document.getElementById('start-date-input').value; const end=document.getElementById('end-date-input').value; const logs=await fetchLogs(c,start,end); renderLogs(logs); });
        document.getElementById('analyze-morph').addEventListener('click', async ()=>{ const c=document.getElementById('stock-code').value.trim(); const d=parseInt(document.getElementById('days-count').value,10)||120; await analyzeMorph(c,d); const start=document.getElementById('start-date-input').value; const end=document.getElementById('end-date-input').value; const logs=await fetchLogs(c,start,end); renderLogs(logs); });
        document.getElementById('clear-logs').addEventListener('click', async ()=>{ const c=document.getElementById('stock-code').value.trim(); const start=document.getElementById('start-date-input').value; const end=document.getElementById('end-date-input').value; await clearLogs(c,start,end); const logs=await fetchLogs(c,start,end); renderLogs(logs); });
        document.querySelectorAll('.tab').forEach(btn=>{ btn.addEventListener('click',()=>{ const t=btn.getAttribute('data-target'); document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none'); document.getElementById(t).style.display='block'; }); });
        // Add Custom Stock Modal Logic
        const customModal = document.getElementById("add-custom-modal");
        const addCustomBtn = document.getElementById("add-custom-btn");
        const customClose = customModal.querySelector(".close");

        if (addCustomBtn) {
            addCustomBtn.onclick = function() { customModal.style.display = "block"; }
            customClose.onclick = function() { customModal.style.display = "none"; }
            window.onclick = function(event) { if (event.target == customModal) { customModal.style.display = "none"; } }

            document.getElementById("submit-custom").onclick = async function() {
                const codeInput = document.getElementById("custom-code").value;
                const label = document.getElementById("custom-label").value;
                const date = document.getElementById("custom-date").value;
                
                if (!codeInput) { alert("请输入股票代码"); return; }
                
                const btn = this;
                const originalText = btn.innerText;
                btn.innerText = "提交中...";
                btn.disabled = true;
                
                try {
                    const res = await fetch('/api/v1/test-tool/add-custom-stock', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ code: codeInput, label: label, custom_date: date })
                    });
                    const data = await res.json();
                    if (data.success || res.ok) {
                        alert(data.message || "添加成功");
                        customModal.style.display = "none";
                        // Clear inputs
                        document.getElementById("custom-code").value = "";
                        document.getElementById("custom-label").value = "";
                        document.getElementById("custom-date").value = "";
                        
                        // Refresh both lists immediately
                        await renderThsList();
                        await renderWencaiList();
                        
                        // Auto load the first added stock if available
                        if (data.stock_info && data.stock_info.stock_code) {
                             document.getElementById('stock-code').value = data.stock_info.stock_code;
                             load(date); // Pass custom date to load function
                        }
                    } else {
                        alert("添加失败: " + (data.detail || data.message || "Unknown error"));
                    }
                } catch (e) {
                    alert("请求错误: " + e.message);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        }

        renderThsList();
        // 默认展示同花顺自选股tab
        document.getElementById('left-ths').style.display='block';
        document.getElementById('left-wencai').style.display='none';
        load();
    </script>
</body>
</html>
