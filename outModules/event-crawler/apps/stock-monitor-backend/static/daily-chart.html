<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票日线图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="/static/js/navbar.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #app { padding: 12px; }
    #chart { width: 100%; height: 600px; }
    .controls { margin-bottom: 8px; }
    input { padding: 6px; margin-right: 8px; }
    button { padding: 6px 12px; }
  </style>
  <script src="/static/js/custom-alert.js"></script>
</head>
<body>
  <div id="app">
    <div class="controls">
      <input id="code" placeholder="股票代码，如 000001.SZ 或 SZ000001" />
      <input id="days" type="number" placeholder="天数" value="120" />
      <button id="load">加载</button>
    </div>
    <div id="chart"></div>
  </div>
  <script>
    const chartDom = document.getElementById('chart');
    const chart = echarts.init(chartDom);
    async function fetchDaily(code, days) {
      const url = `/api/stock/daily/${encodeURIComponent(code)}?days=${days}`;
      const res = await fetch(url);
      const json = await res.json();
      if (!json.success) throw new Error(json.message || '请求失败');
      return json.data || [];
    }
    function toSeries(data) {
      const dates = data.map(d => d.trade_date);
      const k = data.map(d => [d.open, d.close, d.low, d.high]);
      const vol = data.map((d, i) => [i, d.volume || 0, (d.open > d.close ? -1 : 1)]);
      return { dates, k, vol };
    }
    function render(series) {
      chart.setOption({
        tooltip: { trigger: 'axis' },
        axisPointer: { type: 'cross' },
        grid: [{ left: '10%', right: '8%', height: '60%' }, { left: '10%', right: '8%', top: '75%', height: '18%' }],
        xAxis: [{ type: 'category', data: series.dates, boundaryGap: true, axisLine: { onZero: false } }, { type: 'category', gridIndex: 1, data: series.dates, boundaryGap: true, axisLine: { onZero: false } }],
        yAxis: [{ scale: true }, { gridIndex: 1, scale: true }],
        series: [
          { type: 'candlestick', name: 'K线', data: series.k },
          { type: 'bar', name: '成交量', data: series.vol, xAxisIndex: 1, yAxisIndex: 1 }
        ]
      });
    }
    async function load() {
      const code = document.getElementById('code').value.trim();
      const days = parseInt(document.getElementById('days').value, 10) || 120;
      if (!code) return;
      const data = await fetchDaily(code, days);
      const s = toSeries(data);
      render(s);
    }
    document.getElementById('load').addEventListener('click', load);
  </script>
</body>
</html>
