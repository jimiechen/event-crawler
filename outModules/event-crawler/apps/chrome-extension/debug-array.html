<!DOCTYPE html>
<html>
<head>
    <title>数组模块调试</title>
</head>
<body>
    <h1>数组模块调试</h1>
    <button onclick="testArrayExtraction()">测试数组提取</button>
    <div id="results"></div>

    <script>
        // 简化的测试数据
        const testData = `
        <div id="home-recent-matches">
            <tr data-matchid="123">
                <td>2024-01-01</td>
                <td>主队</td>
                <td>客队</td>
                <td>2-1</td>
            </tr>
            <tr data-matchid="124">
                <td>2024-01-02</td>
                <td>主队2</td>
                <td>客队2</td>
                <td>1-0</td>
            </tr>
        </div>
        `;

        // 简化的正则配置
        const regexConfig = {
            home_recent_match_id: /data-matchid="([^"]+)"/,
            home_recent_date: /<td>(\d{4}-\d{2}-\d{2})<\/td>/,
            home_recent_home_team: /<td>([^<]+)<\/td>/,
            home_recent_score: /<td>(\d+-\d+)<\/td>/
        };

        function extractSingleValue(text, regex) {
            console.log('🔍 extractSingleValue called with:', {
                textLength: text ? text.length : 0,
                regexType: typeof regex,
                regexPattern: regex ? regex.toString() : 'null'
            });
            
            if (!text || !regex) {
                console.log('❌ 参数无效');
                return '-';
            }
            
            try {
                const match = text.match(regex);
                const result = match ? match[1] || match[0] : '-';
                console.log('✅ extractSingleValue result:', {
                    found: !!match,
                    matchLength: match ? match.length : 0,
                    result: result
                });
                return result;
            } catch (error) {
                console.error('❌ extractSingleValue error:', error);
                return '-';
            }
        }

        function extractArrayData(regexConfig, text, modulePrefix) {
            console.log(`🏆 开始提取 ${modulePrefix} 模块数据...`);
            const results = [];
            
            try {
                if (!text || typeof text !== 'string') {
                    console.error(`❌ ${modulePrefix} 无效的文本数据:`, typeof text);
                    return results;
                }
                
                if (!regexConfig || typeof regexConfig !== 'object') {
                    console.error(`❌ ${modulePrefix} 无效的正则配置:`, typeof regexConfig);
                    return results;
                }
            
                // 根据模块前缀确定数据容器ID
                let containerSelector = '';
                switch(modulePrefix) {
                    case 'home_recent':
                        containerSelector = 'home-recent-matches';
                        break;
                    case 'away_recent':
                        containerSelector = 'away-recent-matches';
                        break;
                    case 'future':
                        containerSelector = 'future-matches';
                        break;
                    case 'h2h':
                        containerSelector = 'h2h-matches';
                        break;
                }
                
                console.log(`📦 ${modulePrefix} 使用容器选择器: ${containerSelector}`);
                
                // 提取指定容器内的所有 tr 元素
                const containerRegex = new RegExp(`<div[^>]*id="${containerSelector}"[^>]*>([\\s\\S]*?)</div>`, 'g');
                const containerMatch = text.match(containerRegex);
                
                console.log(`🔍 ${modulePrefix} 容器匹配结果:`, containerMatch ? '找到' : '未找到');
                
                if (containerMatch && containerMatch[0]) {
                    const containerContent = containerMatch[0];
                    console.log(`📄 ${modulePrefix} 容器内容长度:`, containerContent.length);
                    
                    // 提取所有 tr 元素
                    const trRegex = /<tr[^>]*data-matchid="([^"]+)"[^>]*>[\s\S]*?<\/tr>/g;
                    let trMatch;
                    let trCount = 0;
                    
                    while ((trMatch = trRegex.exec(containerContent)) !== null) {
                        trCount++;
                        const trContent = trMatch[0];
                        const matchData = {};
                        
                        console.log(`🎯 ${modulePrefix} 处理第 ${trCount} 个比赛记录, match_id: ${trMatch[1]}`);
                        
                        // 为每个字段提取数据
                        Object.keys(regexConfig).forEach(key => {
                            if (key.startsWith(modulePrefix + '_')) {
                                const fieldName = key.replace(modulePrefix + '_', '');
                                const regex = regexConfig[key];
                                
                                if (fieldName === 'match_id') {
                                    matchData[fieldName] = trMatch[1]; // 直接使用 data-matchid 的值
                                    console.log(`🆔 ${modulePrefix}_${fieldName}: ${matchData[fieldName]}`);
                                } else {
                                    const value = extractSingleValue(trContent, regex);
                                    matchData[fieldName] = value;
                                    console.log(`📊 ${modulePrefix}_${fieldName}: ${value}`);
                                }
                            }
                        });
                        
                        if (Object.keys(matchData).length > 0) {
                            results.push(matchData);
                            console.log(`✅ ${modulePrefix} 第 ${trCount} 个比赛记录已添加，字段数: ${Object.keys(matchData).length}`);
                        }
                    }
                    
                    console.log(`🏁 ${modulePrefix} 模块提取完成，共找到 ${trCount} 个比赛记录`);
                } else {
                    console.warn(`⚠️ ${modulePrefix} 未找到容器或容器为空`);
                }
                
                console.log(`📋 ${modulePrefix} 最终结果数组长度: ${results.length}`);
                return results;
                
            } catch (error) {
                console.error(`❌ ${modulePrefix} 提取过程中发生错误:`, error);
                return results;
            }
        }

        function testArrayExtraction() {
            console.log('🚀 开始测试数组提取...');
            console.log('📄 测试数据:', testData);
            console.log('📋 正则配置:', regexConfig);
            
            const result = extractArrayData(regexConfig, testData, 'home_recent');
            console.log('🎉 提取结果:', result);
            
            document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        }
    </script>
</body>
</html>
