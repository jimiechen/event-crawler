<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON输出格式验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .json-output { background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>JSON输出格式验证</h1>
    <button onclick="validateJsonOutput()">验证JSON输出格式</button>
    <div id="results"></div>

    <script>
        // 复制主页面的配置
        const regexConfig = {
            // 主队近期比赛
            home_match_id: /data-matchid="(\d+)"/g,
            home_league: /<p[^>]*>([^<]+)<\/p>/g,
            home_date: /<p[^>]*>(\d{2}-\d{2}-\d{2})<\/p>/g,
            home_team: /<b[^>]*>([^<]+)<\/b>/g,
            away_team: /<b[^>]*>([^<]+)<\/b>/g,
            home_score: /<a[^>]*>([^<]+)<\/a>/g,
            home_team_rank: /<i>(\d+)<\/i>/g,
            away_team_rank: /<i>(\d+)<\/i>/g,
            home_asian_handicap: /<td class="panlu[^"]*">[\s\S]*?([赢走输])[\s\S]*?<\/td>/g,
            home_team_recent_stats: /(近\d+场\d+胜\d+平\d+负)/g,
            home_team_home_stats: /(主场\d+胜\d+平\d+负)/g,

            // 客队近期比赛
            away_match_id: /data-matchid="(\d+)"/g,
            away_league: /<p[^>]*>([^<]+)<\/p>/g,
            away_date: /<p[^>]*>(\d{2}-\d{2}-\d{2})<\/p>/g,
            away_home_team: /<b[^>]*>([^<]+)<\/b>/g,
            away_away_team: /<b[^>]*>([^<]+)<\/b>/g,
            away_score: /<a[^>]*>([^<]+)<\/a>/g,
            away_home_team_rank: /<i>(\d+)<\/i>/g,
            away_away_team_rank: /<i>(\d+)<\/i>/g,
            away_asian_handicap: /<td class="panlu[^"]*">[\s\S]*?([赢走输])[\s\S]*?<\/td>/g,
            away_team_recent_stats: /(近\d+场\d+胜\d+平\d+负)/g,
            away_team_away_stats: /(客场\d+胜\d+平\d+负)/g,

            // 未来比赛
            future_match_id: /data-matchid="(\d+)"/g,
            future_league: /<p[^>]*>([^<]+)<\/p>/g,
            future_date: /<p[^>]*>(\d{2}-\d{2}-\d{2})<\/p>/g,
            future_home_team: /<b[^>]*>([^<]+)<\/b>/g,
            future_away_team: /<b[^>]*>([^<]+)<\/b>/g,
            future_score: /<a[^>]*>([^<]+)<\/a>/g,
            future_home_team_rank: /<i>(\d+)<\/i>/g,
            future_away_team_rank: /<i>(\d+)<\/i>/g,
            future_asian_handicap: /<td class="panlu[^"]*">[\s\S]*?([赢走输])[\s\S]*?<\/td>/g,
            future_home_team_stats: /(近\d+场\d+胜\d+平\d+负)/g,
            future_away_team_stats: /(近\d+场\d+胜\d+平\d+负)/g,

            // 两队交锋
            h2h_match_id: /data-matchid="(\d+)"/g,
            h2h_league: /<p[^>]*>([^<]+)<\/p>/g,
            h2h_date: /<p[^>]*>(\d{2}-\d{2}-\d{2})<\/p>/g,
            h2h_home_team: /<b[^>]*>([^<]+)<\/b>/g,
            h2h_away_team: /<b[^>]*>([^<]+)<\/b>/g,
            h2h_score: /<a[^>]*>([^<]+)<\/a>/g,
            h2h_home_team_rank: /<i>(\d+)<\/i>/g,
            h2h_away_team_rank: /<i>(\d+)<\/i>/g,
            h2h_asian_handicap: /<td class="panlu[^"]*">[\s\S]*?([赢走输])[\s\S]*?<\/td>/g,
            h2h_home_team_stats: /(近\d+场\d+胜\d+平\d+负)/g,
            h2h_away_team_stats: /(近\d+场\d+胜\d+平\d+负)/g
        };

        const testData = `
            <tr attr="15,2-0,180" data-lt="league" data-matchid="1280854" class="nolink">
                <td class="gray6 pl10"><p style="width:50px;height:18px;overflow: hidden;margin:auto">欧国联</p><p class="gray9">25-10-12</p></td>
                <td><div class="team-name-l"><b class="fontboldno">荷兰</b>
                    <span>
                        <i>世</i>
                        <i>7</i>
                    </span>
                </div></td>
                <td class="font14 team-score">
                    <a href="/match/history.php?MatchID=1280854&from=%2Fjczq%2F">4-0</a>
                </td>
                <td><div class="team-name-r"><b class="fontbold fontblack">匈牙利</b>
                    <span>
                        <i>37</i>
                        <i>世</i>
                    </span>
                </div></td>
                <td class="panlu red">赢</td>
            </tr>
            <div class="team-stats">
                <p>荷兰队近期战绩：近10场3胜2平5负，主场3胜1平2负</p>
                <p>波兰队近期战绩：近10场2胜3平5负，客场1胜2平3负</p>
            </div>
        `;

        function generateJsonPreview(htmlContent) {
            const jsonData = {};
            
            Object.entries(regexConfig).forEach(([key, regex]) => {
                // 重置正则表达式的lastIndex
                regex.lastIndex = 0;
                
                // 提取第一个匹配项
                const match = regex.exec(htmlContent);
                
                // 只取第一个捕获组，如果没有匹配则设为"-"
                jsonData[key] = match && match[1] ? match[1] : "-";
            });
            
            return jsonData;
        }

        function validateJsonOutput() {
            const resultsDiv = document.getElementById('results');
            let results = '<h3>验证结果：</h3>';
            
            // 生成JSON输出
            const jsonOutput = generateJsonPreview(testData);
            
            // 验证规则
            const validationResults = [];
            
            // 1. 检查所有字段都存在
            const expectedFieldCount = 46;
            const actualFieldCount = Object.keys(jsonOutput).length;
            validationResults.push({
                test: '字段数量检查',
                expected: expectedFieldCount,
                actual: actualFieldCount,
                passed: actualFieldCount === expectedFieldCount
            });
            
            // 2. 检查所有值都是字符串
            const allStrings = Object.values(jsonOutput).every(value => typeof value === 'string');
            validationResults.push({
                test: '数据类型检查',
                expected: '所有值都是字符串',
                actual: allStrings ? '所有值都是字符串' : '存在非字符串值',
                passed: allStrings
            });
            
            // 3. 检查默认值
            const defaultValues = Object.values(jsonOutput).filter(value => value === '-');
            validationResults.push({
                test: '默认值检查',
                expected: '未匹配字段应为"-"',
                actual: `${defaultValues.length}个字段使用默认值"-"`,
                passed: defaultValues.length > 0
            });
            
            // 4. 检查统计信息字段
            const statsFields = Object.keys(jsonOutput).filter(key => key.includes('_stats'));
            validationResults.push({
                test: '统计信息字段检查',
                expected: '8个统计信息字段',
                actual: `${statsFields.length}个统计信息字段`,
                passed: statsFields.length === 8
            });
            
            // 显示验证结果
            validationResults.forEach(result => {
                const status = result.passed ? 'success' : 'error';
                results += `<div class="test-result ${status}">
                    <strong>${result.test}:</strong><br>
                    期望: ${result.expected}<br>
                    实际: ${result.actual}<br>
                    结果: ${result.passed ? '✅ 通过' : '❌ 失败'}
                </div>`;
            });
            
            // 显示JSON输出示例
            results += '<div class="json-output">';
            results += '<h4>JSON输出示例：</h4>';
            results += '<pre>' + JSON.stringify(jsonOutput, null, 2) + '</pre>';
            results += '</div>';
            
            resultsDiv.innerHTML = results;
        }
    </script>
</body>
</html>
