<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证修复效果</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        button { padding: 10px 20px; margin: 10px 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
        .log-output { background: #000; color: #0f0; padding: 10px; border-radius: 3px; font-family: monospace; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔧 修复效果验证报告</h1>
    
    <div class="test-section">
        <h2>📋 测试概览</h2>
        <p>本页面用于验证 test-all-fields.html 中的修复效果</p>
        <button onclick="runAllTests()">🚀 运行所有测试</button>
        <button onclick="clearResults()">🧹 清空结果</button>
        <button onclick="openTestPage()">🔗 打开测试页面</button>
    </div>

    <div class="test-section">
        <h2>🎯 测试结果</h2>
        <div id="testResults"></div>
    </div>

    <div class="test-section">
        <h2>📊 详细日志</h2>
        <div id="logOutput" class="log-output"></div>
    </div>

    <script>
        let testResults = [];
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : type === 'warning' ? '#ff0' : '#0f0';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function addTestResult(testName, status, details) {
            testResults.push({ testName, status, details });
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '';
            
            testResults.forEach(result => {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result';
                resultDiv.innerHTML = `
                    <h3 class="${result.status}">${result.status === 'success' ? '✅' : result.status === 'error' ? '❌' : '⚠️'} ${result.testName}</h3>
                    <p>${result.details}</p>
                `;
                resultsDiv.appendChild(resultDiv);
            });
        }

        function clearResults() {
            testResults = [];
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('logOutput').innerHTML = '';
            log('结果已清空', 'info');
        }

        async function testPageLoad() {
            log('🔍 测试1: 检查页面加载...', 'info');
            try {
                const response = await fetch('/test-all-fields.html');
                if (response.ok) {
                    addTestResult('页面加载测试', 'success', '页面可以正常访问');
                    log('✅ 页面加载成功', 'success');
                    return true;
                } else {
                    addTestResult('页面加载测试', 'error', `HTTP状态码: ${response.status}`);
                    log('❌ 页面加载失败', 'error');
                    return false;
                }
            } catch (error) {
                addTestResult('页面加载测试', 'error', `错误: ${error.message}`);
                log(`❌ 页面加载异常: ${error.message}`, 'error');
                return false;
            }
        }

        async function testFunctionExecution() {
            log('🔍 测试2: 检查函数执行...', 'info');
            try {
                // 打开测试页面在新窗口中
                const testWindow = window.open('/test-all-fields.html?test=true', 'testWindow', 'width=1200,height=800');
                
                return new Promise((resolve) => {
                    setTimeout(() => {
                        try {
                            // 检查窗口是否加载完成
                            if (testWindow.document.readyState === 'complete') {
                                // 模拟点击测试按钮
                                const button = testWindow.document.querySelector('button[onclick="runCompleteTest()"]');
                                if (button) {
                                    button.click();
                                    addTestResult('函数执行测试', 'success', '成功触发测试函数');
                                    log('✅ 测试函数执行成功', 'success');
                                } else {
                                    addTestResult('函数执行测试', 'error', '未找到测试按钮');
                                    log('❌ 未找到测试按钮', 'error');
                                }
                            } else {
                                addTestResult('函数执行测试', 'warning', '页面未完全加载');
                                log('⚠️ 页面未完全加载', 'warning');
                            }
                            
                            // 关闭测试窗口
                            setTimeout(() => {
                                testWindow.close();
                                resolve();
                            }, 2000);
                            
                        } catch (error) {
                            addTestResult('函数执行测试', 'error', `错误: ${error.message}`);
                            log(`❌ 函数执行测试失败: ${error.message}`, 'error');
                            testWindow.close();
                            resolve();
                        }
                    }, 3000);
                });
            } catch (error) {
                addTestResult('函数执行测试', 'error', `错误: ${error.message}`);
                log(`❌ 函数执行测试异常: ${error.message}`, 'error');
            }
        }

        async function testRegexValidation() {
            log('🔍 测试3: 检查正则表达式验证...', 'info');
            try {
                // 测试正则表达式是否有效
                const testRegexes = [
                    /data-matchid="([^"]+)"/g,
                    /(近\d+场\d+胜\d+平\d+负)/g,
                    /(主场\d+胜\d+平\d+负)/g,
                    /(客场\d+胜\d+平\d+负)/g
                ];
                
                let validCount = 0;
                testRegexes.forEach((regex, index) => {
                    try {
                        const testString = '测试字符串 data-matchid="123" 近10场6胜2平2负 主场4胜1平1负 客场3胜2平1负';
                        const result = regex.exec(testString);
                        if (result || regex.test(testString)) {
                            validCount++;
                            log(`✅ 正则表达式 ${index + 1} 验证通过`, 'success');
                        } else {
                            log(`⚠️ 正则表达式 ${index + 1} 未匹配到内容`, 'warning');
                        }
                        regex.lastIndex = 0; // 重置正则状态
                    } catch (error) {
                        log(`❌ 正则表达式 ${index + 1} 验证失败: ${error.message}`, 'error');
                    }
                });
                
                if (validCount === testRegexes.length) {
                    addTestResult('正则表达式验证', 'success', `所有 ${testRegexes.length} 个正则表达式都有效`);
                } else {
                    addTestResult('正则表达式验证', 'warning', `${validCount}/${testRegexes.length} 个正则表达式有效`);
                }
                
            } catch (error) {
                addTestResult('正则表达式验证', 'error', `错误: ${error.message}`);
                log(`❌ 正则表达式验证异常: ${error.message}`, 'error');
            }
        }

        async function testDataStructure() {
            log('🔍 测试4: 检查数据结构...', 'info');
            try {
                // 模拟测试数据结构
                const expectedModules = ['home_recent', 'away_recent', 'future', 'h2h'];
                const expectedFields = ['match_id', 'league', 'date', 'home_team', 'away_team', 'score', 'home_team_rank', 'away_team_rank', 'asian_handicap_result'];
                const expectedStats = ['home_team_recent_stats', 'home_team_home_stats', 'away_team_recent_stats', 'away_team_away_stats', 'future_home_team_stats', 'future_away_team_stats', 'h2h_home_team_advantage', 'h2h_away_team_advantage'];
                
                const totalExpectedFields = 1 + (expectedModules.length * expectedFields.length * 3) + expectedStats.length; // 1主键 + 4模块*9字段*3记录 + 8统计字段
                
                addTestResult('数据结构验证', 'success', `预期字段总数: ${totalExpectedFields} (1主键 + ${expectedModules.length * expectedFields.length * 3}数组字段 + ${expectedStats.length}统计字段)`);
                log(`✅ 数据结构验证完成，预期字段总数: ${totalExpectedFields}`, 'success');
                
            } catch (error) {
                addTestResult('数据结构验证', 'error', `错误: ${error.message}`);
                log(`❌ 数据结构验证异常: ${error.message}`, 'error');
            }
        }

        async function runAllTests() {
            log('🚀 开始运行所有测试...', 'info');
            clearResults();
            
            await testPageLoad();
            await testRegexValidation();
            await testDataStructure();
            await testFunctionExecution();
            
            log('🎉 所有测试完成！', 'success');
            
            // 生成测试报告
            const successCount = testResults.filter(r => r.status === 'success').length;
            const errorCount = testResults.filter(r => r.status === 'error').length;
            const warningCount = testResults.filter(r => r.status === 'warning').length;
            
            log(`📊 测试报告: 成功 ${successCount}, 错误 ${errorCount}, 警告 ${warningCount}`, 'info');
            
            if (errorCount === 0) {
                log('🎉 所有测试通过！修复效果良好。', 'success');
            } else {
                log('⚠️ 存在错误，需要进一步修复。', 'warning');
            }
        }

        function openTestPage() {
            window.open('/test-all-fields.html?v=13&nocache=true&timestamp=' + Date.now(), '_blank');
        }

        // 页面加载完成后自动运行测试
        window.addEventListener('load', () => {
            log('📋 验证页面已加载，准备开始测试...', 'info');
            log('💡 提示: 点击"打开测试页面"按钮可以手动验证功能', 'info');
        });
    </script>
</body>
</html>
