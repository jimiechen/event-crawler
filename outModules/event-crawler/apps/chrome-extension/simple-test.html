<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单数据提取测试</title>
</head>
<body>
    <h1>数据提取测试</h1>
    <button onclick="testExtraction()">测试数据提取</button>
    <div id="results"></div>

    <script>
        // 简化的测试数据
        const testData = `
            <div id="h2h-matches" class="h2h-matches">
                <table>
                    <tbody>
                        <tr data-matchid="1280863">
                            <td><p>欧国联</p><p>24-06-15</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">2-1</a></td>
                            <td><b class="fontbold fontblack">利物浦</b></td>
                            <td class="panlu red">赢</td>
                        </tr>
                        <tr data-matchid="1280864">
                            <td><p>友谊赛</p><p>23-11-20</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">0-2</a></td>
                            <td><b class="fontbold fontblack">利物浦</b></td>
                            <td class="panlu green">输</td>
                        </tr>
                        <tr data-matchid="1280865">
                            <td><p>欧洲杯</p><p>23-03-10</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">1-1</a></td>
                            <td><b class="fontbold fontblack">利物浦</b></td>
                            <td class="panlu yellow">走</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="future-matches" class="future-matches">
                <table>
                    <tbody>
                        <tr data-matchid="1280860">
                            <td><p>英超</p><p>25-01-15</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">VS</a></td>
                            <td><b class="fontbold fontblack">利物浦</b></td>
                            <td class="panlu blue">-</td>
                        </tr>
                        <tr data-matchid="1280861">
                            <td><p>欧冠</p><p>25-01-22</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">VS</a></td>
                            <td><b class="fontbold fontblack">巴萨</b></td>
                            <td class="panlu blue">-</td>
                        </tr>
                        <tr data-matchid="1280862">
                            <td><p>友谊赛</p><p>25-02-01</p></td>
                            <td><b class="fontboldno">荷兰</b></td>
                            <td><a href="#">VS</a></td>
                            <td><b class="fontbold fontblack">意大利</b></td>
                            <td class="panlu blue">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        `;

        function testExtraction() {
            console.log('开始测试数据提取...');
            
            // 测试两队交锋容器匹配
            const h2hContainerRegex = /<div[^>]*id="h2h-matches"[^>]*>([\s\S]*?)<\/div>/g;
            const h2hMatch = testData.match(h2hContainerRegex);
            console.log('两队交锋容器匹配:', h2hMatch ? '成功' : '失败');
            
            if (h2hMatch) {
                // 提取tr元素
                const trRegex = /<tr[^>]*data-matchid="([^"]+)"[^>]*>[\s\S]*?<\/tr>/g;
                const trMatches = [];
                let trMatch;
                while ((trMatch = trRegex.exec(h2hMatch[0])) !== null) {
                    trMatches.push(trMatch[1]);
                }
                console.log('两队交锋比赛ID:', trMatches);
            }
            
            // 测试未来比赛容器匹配
            const futureContainerRegex = /<div[^>]*id="future-matches"[^>]*>([\s\S]*?)<\/div>/g;
            const futureMatch = testData.match(futureContainerRegex);
            console.log('未来比赛容器匹配:', futureMatch ? '成功' : '失败');
            
            if (futureMatch) {
                // 提取tr元素
                const trRegex = /<tr[^>]*data-matchid="([^"]+)"[^>]*>[\s\S]*?<\/tr>/g;
                const trMatches = [];
                let trMatch;
                while ((trMatch = trRegex.exec(futureMatch[0])) !== null) {
                    trMatches.push(trMatch[1]);
                }
                console.log('未来比赛比赛ID:', trMatches);
            }
            
            // 显示结果
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <h2>测试结果</h2>
                <p>两队交锋容器: ${h2hMatch ? '✅ 找到' : '❌ 未找到'}</p>
                <p>未来比赛容器: ${futureMatch ? '✅ 找到' : '❌ 未找到'}</p>
                <p>详细结果请查看控制台</p>
            `;
        }
    </script>
</body>
</html>
